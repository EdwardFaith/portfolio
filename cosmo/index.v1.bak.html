/* ===== UTILI DI DISEGNO ===== */
function rgba(c,a){
  if(!c||c.charAt(0)!=="#")return c;
  var n=parseInt(c.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function rnd(i){var v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v);}
function sceneKind(){
  var s=(P&&P.scene)?String(P.scene).toUpperCase():"CITY";
  if(s.indexOf("FOGN")>=0||s.indexOf("SOTT")>=0)return "sewer";
  if(s.indexOf("SUPER")>=0||s.indexOf("MERCATO")>=0||s.indexOf("SPESA")>=0)return "market";
  if(s.indexOf("BANCA")>=0)return "bank";
  if(s.indexOf("SCUOL")>=0)return "school";
  return "city";
}
function skyGrad(c0,c1,c2){
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,c0);g.addColorStop(.55,c1);g.addColorStop(1,c2);

}
function vignette(a){
  var v=ctx.createRadialGradient(VW/2,VH*.46,190,VW/2,VH/2,700);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,"+a+")");
  ctx.fillStyle=v;ctx.fillRect(0,0,VW,VH);
}
function buildingLayer(col,step,amp,par,seed,winCol,winP){
  var off=(cam.x*par)%step,base=500;
  for(var i=-1;i<VW/step+2;i++){
    var id=i+Math.floor(cam.x*par/step),x=i*step-off;
    var w=step*(.58+.3*rnd(id*3.1+seed)),bh=amp*(.38+rnd(id*1.7+seed)*.62);
    ctx.fillStyle=col;ctx.fillRect(x,base-bh,w,bh+VH);
    ctx.fillRect(x+w*.22,base-bh-9,w*.32,9);
    if(rnd(id*5.3+seed)>.74)ctx.fillRect(x+w*.62,base-bh-34,4,34);
    for(var wy=base-bh+16;wy<base-18;wy+=24){
      for(var wx=x+9;wx<x+w-12;wx+=19){
        if(rnd(wx*.11+wy*.53+seed)<winP){ctx.fillStyle=winCol;ctx.fillRect(wx,wy,7,11);ctx.fillStyle=col;}
      }
    }
  }
}

var last=performance.now();
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000);last=ts;t+=dt;if(sayT>0)sayT-=dt;

  ctx.restore();mouse.clicked=false;requestAnimationFrame(frame);
}
