<script>"use strict";
(function(){
/* ============================================================
   MEMORIE DEL COSMO — LE OTTO SPEDIZIONI
   La mappa e' una citta' grande: si scorre a destra e a sinistra
   ma anche in su e in giu' (tetti, strada, fogne). Il coniglio e'
   quello del museo. Le armi sono quelle scelte in sala d'armi.
   Si prende la cassetta, e da quel momento il cielo ha un occhio:
   il tempo della memoria comincia a scendere, e l'Occhio ti cerca dal cielo.
   Torni al furgone prima che ti veda, o diventi margherita.
   ============================================================ */
/* ============================================================
   LE OTTO MISSIONI — una cassetta, un gioco.
   La pagina è una sola, ma non è la stessa partita: il numero in
   fondo all'indirizzo (cosmo/index.html?m=3) decide quale cassetta
   stai cercando. Cassetta N = gioco N = tgN.MP3: la radio che suona
   qui dentro è quella della cassetta, e la stazione è la stessa di
   RadioKaoSs (tg del cosmo). Più il numero sale, più il tempo
   scende, più la strada si riempie e meno tempo hai prima che
   l'Occhio ti veda.
   ============================================================ */
var QM=/[?&](?:m|g)=(\d+)/.exec(location.search||"");
var IS_ENDLESS = /[?&](?:endless|infinito)=1/.test(location.search||"") || (QM && QM[1] === "0");
var MEM = IS_ENDLESS ? 0 : parseInt(QM?QM[1]:"1",10);
if(!IS_ENDLESS && !(MEM>=1&&MEM<=8)) MEM=1;
/* i posti: la strada sta a 1580, i tetti fra 940 e 1250, le fogne a
   2280. La cassetta cambia piano ogni volta, il furgone resta in
   strada ma non sempre dallo stesso lato. */
var MISSIONS=[
  {n:1,it:"MEMORIE DEL COSMO",nome:"TIX-9",timer:46,hp:5,foes:1,
   cass:{x:4780,y:2280},exit:{x:300,y:1580},notes:["e01","e02","e03"],where:"e' in fondo alle fogne"},
  {n:2,it:"IL SOTTOSUOLO",nome:"TIX-8",timer:44,hp:5,foes:1.2,
   cass:{x:3100,y:1000},exit:{x:5650,y:1580},notes:["e04","e05","e06"],where:"e' su un tetto, oltre le voragini"},
  {n:3,it:"IL DIAVOLO",nome:"TIX-7",timer:42,hp:4,foes:1.4,
   cass:{x:3400,y:1580},exit:{x:360,y:1580},notes:["e07","e08","e09"],where:"e' in mezzo alla strada, sotto la luna rotta"},
  {n:4,it:"LA GUERRA DEI CONIGLI",nome:"TIX-6",timer:40,hp:4,foes:1.6,
   cass:{x:6500,y:940},exit:{x:400,y:1580},notes:["e10","e11","e12"],where:"e' sul tetto piu' alto, nella zona di fallout"},
  {n:5,it:"IL SEGNALE",nome:"TIX-5",timer:38,hp:3,foes:1.8,
   cass:{x:1600,y:2280},exit:{x:7350,y:1580},notes:["e13","e14","e15"],where:"e' nelle fogne radioattive, tra i fanghi tossici"},
  {n:6,it:"LA DANZA",nome:"TIX-4",timer:36,hp:3,foes:2.0,
   cass:{x:4400,y:1220},exit:{x:350,y:1580},notes:["e16","e17","e18"],where:"e' sul tetto di mezzo, dove si ballava"},
  {n:7,it:"L'OCCHIO NEL CIELO",nome:"TIX-3",timer:35,hp:3,foes:2.2,
   cass:{x:8350,y:1580},exit:{x:400,y:1580},notes:["e19","e20","e21"],where:"e' in strada, oltre le macerie atomiche"},
  {n:8,it:"DOPO TIX",nome:"TIX-2",timer:34,hp:2,foes:2.4,
   cass:{x:1100,y:1080},exit:{x:9150,y:1580},notes:["e22","e23","e24"],where:"e' sul primo bastione, alle soglie del cratere finale"}
];
var MZ_ENDLESS = {
  n: 0,
  it: "IL GIOCO ETERNO",
  nome: "TIX-INFINITY",
  timer: 99999,
  hp: 6,
  foes: 2.0,
  cass: { x: -9999, y: -9999 },
  exit: { x: -9999, y: -9999 },
  notes: [],
  where: "resisti alle ondate della corruzione"
};
var MZ = IS_ENDLESS ? MZ_ENDLESS : MISSIONS[MEM-1];
document.title = IS_ENDLESS ? "IL GIOCO ETERNO · ONDATE INFINITE · MEMORIE DEL COSMO" : ("MISSIONE "+MEM+" · "+MZ.it+" · MEMORIE DEL COSMO");
function returnToCosmo(){
  var dest="../museo.html?stanza=cosmo";
  location.href=dest;
}
(function(){
  var b=document.getElementById("back");
  if(b && document.referrer && document.referrer.indexOf("museo.html")>=0) b.href="../museo.html?stanza=cosmo";
})();
(function(){
  var v=document.getElementById("ver");
  if(v)v.textContent="MEMORIE DEL COSMO · MISSIONE "+MEM+" · "+MZ.nome;
  var h=document.getElementById("hint");
  if(h)h.textContent="A/D muovi · SPAZIO salta · W/S scale · mouse mira · click spara · 1/2/3 armi (Q) · "+
    "F occhio (stasi 10s) · E prendi · M radio · R ricomincia";
})();
/* ---- la radio della cassetta: tg N.MP3, quella e non un'altra ---
   Parte al primo tasto (i browser non lasciano suonare da soli), si
   spegne con M, e resta la stessa per tutta la partita: è la colonna
   sonora della memoria, non un jingle. */

/* ============================================================
   AUDIO ENGINE PROCEDURALE COMPLETO — SFX ARMI, IMPATTI, PASSI,
   MORTE, AMBIENTE & GLITCH POST-ATOMICO
   ============================================================ */
var SFX = (function(){
  var ctx = null;
  var masterGain = null, compressor = null, sfxGain = null, ambGain = null;
  var droneOsc1 = null, droneOsc2 = null, droneGain = null;
  var muted = false;

  function init(){
    if (ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();

      // Master Dynamics Compressor prevents any digital distortion while giving punchy loudness
      compressor = ctx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-12, ctx.currentTime);
      compressor.knee.setValueAtTime(6, ctx.currentTime);
      compressor.ratio.setValueAtTime(5, ctx.currentTime);
      compressor.attack.setValueAtTime(0.003, ctx.currentTime);
      compressor.release.setValueAtTime(0.12, ctx.currentTime);
      compressor.connect(ctx.destination);

      masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.96, ctx.currentTime);
      masterGain.connect(compressor);

      sfxGain = ctx.createGain();
      sfxGain.gain.setValueAtTime(1.0, ctx.currentTime);
      sfxGain.connect(masterGain);

      ambGain = ctx.createGain();
      ambGain.gain.setValueAtTime(0.48, ctx.currentTime);
      ambGain.connect(masterGain);

      initAmbience();
    } catch(e) {}
  }

  function resume(){
    if (!ctx) init();
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(function(){});
    }
  }

  function initAmbience(){
    if (!ctx || droneOsc1) return;
    try {
      // 1. Post-atomic cinematic drone (sub-oscillatori caldi e profondi, zero fruscii o scricchiolii)
      droneOsc1 = ctx.createOscillator();
      droneOsc2 = ctx.createOscillator();
      droneOsc1.type = 'sawtooth';
      droneOsc2.type = 'triangle';
      droneOsc1.frequency.setValueAtTime(48, ctx.currentTime);
      droneOsc2.frequency.setValueAtTime(51.5, ctx.currentTime);

      var droneFilter = ctx.createBiquadFilter();
      droneFilter.type = 'lowpass';
      var dFreq = (IS_ENDLESS || (typeof G !== 'undefined' && G.endless)) ? 130 : (85 + MEM * 14);
      droneFilter.frequency.setValueAtTime(dFreq, ctx.currentTime);

      droneGain = ctx.createGain();
      droneGain.gain.setValueAtTime(0.16, ctx.currentTime);

      droneOsc1.connect(droneFilter);
      droneOsc2.connect(droneFilter);
      droneFilter.connect(droneGain);
      droneGain.connect(ambGain);

      droneOsc1.start();
      droneOsc2.start();

      // 2. Dystopian Tekno Groove: SOLO per le missioni standard 1-8;
      // Nel Gioco Eterno / Modalita' Infinita NIENTE MUSICA (solo tg0.mpeg + sound ambientale spari)
      if (!IS_ENDLESS && (!G || !G.endless)) {
        initTekno();
      }
    } catch(e) {}
  }

  /* ---- DYSTOPIAN TEKNO ENGINE (HOTLINE MIAMI STYLE) ----
     128 BPM, 4-on-the-floor electro kick, offbeat hat,
     pumping 16th-note sawtooth synth bass, and dark dystopian chords.
     Attivo SOLO nelle missioni 1-8. In Modalità Infinita è disattivato. */
  var teknoTimer = null;
  var teknoStep = 0;
  var teknoGain = null;

  function initTekno(){
    if (IS_ENDLESS || (typeof G !== 'undefined' && G.endless)) return; // No musica tekno nel Gioco Eterno
    if (!ctx || teknoGain) return;
    try {
      teknoGain = ctx.createGain();
      teknoGain.gain.setValueAtTime(0.16, ctx.currentTime);
      teknoGain.connect(masterGain);
      startTeknoLoop();
    } catch(e) {}
  }

  function startTeknoLoop(){
    if (IS_ENDLESS || (typeof G !== 'undefined' && G.endless)) return;
    if (teknoTimer) clearInterval(teknoTimer);
    var stepDuration = (60 / 128) / 4; // 16th note a 128 BPM (~117ms)
    var intervalMs = Math.round(stepDuration * 1000);

    var bassFreqs = [
      73.42, 73.42, 73.42, 87.31, // D2, D2, D2, F2
      73.42, 73.42, 110.0, 98.0,  // D2, D2, A2, G2
      58.27, 58.27, 58.27, 65.41, // Bb1, Bb1, Bb1, C2
      65.41, 65.41, 73.42, 87.31  // C2, C2, D2, F2
    ];

    teknoTimer = setInterval(function(){
      if (muted || !ctx || ctx.state !== 'running') return;
      var t = ctx.currentTime;
      var step16 = teknoStep % 16;
      var step32 = teknoStep % 32;

      // 1. Kick (4-on-the-floor: beats 0, 4, 8, 12)
      if (step16 % 4 === 0) {
        playTeknoKick(t);
      }

      // 2. Offbeat Hi-hat (steps 2, 6, 10, 14)
      if (step16 % 4 === 2) {
        playTeknoHat(t, 0.22);
      } else if (step16 % 2 === 1) {
        playTeknoHat(t, 0.07);
      }

      // 3. Pumping 16th Synth Bass
      var noteIdx = Math.floor(teknoStep / 2) % bassFreqs.length;
      var noteFreq = bassFreqs[noteIdx];
      var bassVol = (step16 % 4 === 0) ? 0.22 : 0.38;
      playTeknoBass(t, noteFreq, stepDuration * 0.9, bassVol);

      // 4. Dark Dystopian Synth Chord Stabs (su cambi di battuta)
      if (step16 === 0) {
        var chordRoot = (step32 < 16) ? 146.83 : 116.54;
        playTeknoChord(t, chordRoot);
      }

      teknoStep = (teknoStep + 1) % 64;
    }, intervalMs);
  }

  function playTeknoKick(t){
    try {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(42, t + 0.08);
      gain.gain.setValueAtTime(0.65, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      osc.connect(gain);
      gain.connect(teknoGain);
      osc.start(t);
      osc.stop(t + 0.12);
    } catch(e) {}
  }

  function playTeknoHat(t, vol){
    try {
      var bufLen = Math.floor(ctx.sampleRate * 0.035);
      var buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.22));
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(6500, t);
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(vol || 0.16, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(teknoGain);
      src.start(t);
    } catch(e) {}
  }

  function playTeknoBass(t, freq, dur, vol){
    try {
      var osc = ctx.createOscillator();
      var filter = ctx.createBiquadFilter();
      var gain = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t);

      filter.type = 'lowpass';
      filter.Q.setValueAtTime(4.2, t);
      filter.frequency.setValueAtTime(freq * 6.5, t);
      filter.frequency.exponentialRampToValueAtTime(freq * 1.8, t + dur);

      gain.gain.setValueAtTime(vol || 0.32, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(teknoGain);
      osc.start(t);
      osc.stop(t + dur + 0.01);
    } catch(e) {}
  }

  function playTeknoChord(t, rootFreq){
    try {
      [rootFreq, rootFreq * 1.1892, rootFreq * 1.4983].forEach(function(f){
        var osc = ctx.createOscillator();
        var filter = ctx.createBiquadFilter();
        var gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, t);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1100, t);
        filter.frequency.exponentialRampToValueAtTime(350, t + 0.7);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(teknoGain);
        osc.start(t);
        osc.stop(t + 0.78);
      });
    } catch(e) {}
  }

  /* ---- SHOOTING SFX ---- */
  function shoot(wType){
    resume();
    if (!ctx) return;
    try {
      var t = ctx.currentTime;
      if (wType === 'pistol') {
        // 1. Kick thump (deep low punch)
        var kick = ctx.createOscillator();
        var kGain = ctx.createGain();
        kick.type = 'sine';
        kick.frequency.setValueAtTime(820, t);
        kick.frequency.exponentialRampToValueAtTime(50, t + 0.12);
        kGain.gain.setValueAtTime(0.65, t);
        kGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        kick.connect(kGain);
        kGain.connect(sfxGain);
        kick.start(t);
        kick.stop(t + 0.15);

        // 2. High metallic gunshot crack (noise burst)
        var bufLen = Math.floor(ctx.sampleRate * 0.07);
        var buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.25));
        var snap = ctx.createBufferSource();
        snap.buffer = buf;

        var fSnap = ctx.createBiquadFilter();
        fSnap.type = 'highpass';
        fSnap.frequency.setValueAtTime(1100, t);

        var sGain = ctx.createGain();
        sGain.gain.setValueAtTime(0.55, t);
        snap.connect(fSnap);
        fSnap.connect(sGain);
        sGain.connect(sfxGain);
        snap.start(t);

        // 3. Shell mechanical snap
        var shell = ctx.createOscillator();
        var shGain = ctx.createGain();
        shell.type = 'square';
        shell.frequency.setValueAtTime(1400, t + 0.02);
        shell.frequency.exponentialRampToValueAtTime(400, t + 0.07);
        shGain.gain.setValueAtTime(0.18, t + 0.02);
        shGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        shell.connect(shGain);
        shGain.connect(sfxGain);
        shell.start(t + 0.02);
        shell.stop(t + 0.09);

      } else if (wType === 'smg') {
        // Fast, rapid-fire staccato machine gun
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(680, t);

/* ---- collisioni -------------------------------------------- */
function hitsAt(x,y,w,h){
  var bx=x-w/2,by=y-h,i,s;
  for(i=0;i<SOL.length;i++){
    s=SOL[i];
    if(bx<s.x+s.w&&bx+w>s.x&&by<s.y+s.h&&by+h>s.y)return s;
  }
  return null;
}
function ladderAt(x,y){
  var i,l;
  for(i=0;i<LAD.length;i++){
    l=LAD[i];
    if(Math.abs(x-l.x)<36&&y<=l.y0+14&&y>=l.y1-14)return l;
  }
  return null;
}
function groundBelow(x,y){
  var i,s,best=null;
  for(i=0;i<SOL.length;i++){
    s=SOL[i];
    if(x>s.x-4&&x<s.x+s.w+4&&s.y>=y-6&&(!best||s.y<best.y))best=s;
  }
  return best;
}

function spawnEndlessWave(wave){
  ents.length = 0;
  // NEMICI TANTI, SEMPRE DI PIÙ E FRENETICI!
  var count = 18 + (wave - 1) * 8;
  G.waveTotal = count;
  var hpMult = 1.0 + Math.min(2.5, (wave - 1) * 0.16);
  var spdMult = 1.0 + Math.min(1.4, (wave - 1) * 0.10);

  // Distanza minima di sicurezza assoluta: compaiono sempre lontani dal giocatore (>1800px)
  var safeDist = 1800;

  for(var i = 0; i < count; i++){
    var t = (i % 3 === 0) ? "drone" : (i % 3 === 1) ? "soldier" : "daisy";
    var rx;

    var canLeft = (P.x - safeDist) > 300;
    var canRight = (P.x + safeDist) < (W - 300);

    var spawnLeft = false;
    if (canLeft && canRight) {
      spawnLeft = (i % 2 === 1);
    } else if (canLeft) {
      spawnLeft = true;
    } else {
      spawnLeft = false;
    }

    if (spawnLeft) {
      var minX = 160;
      var maxX = Math.max(minX + 50, P.x - safeDist);
      rx = minX + Math.random() * (maxX - minX);
    } else {
      var minX2 = Math.min(W - 300, P.x + safeDist);
      var maxX2 = W - 160;
      rx = minX2 + Math.random() * (maxX2 - minX2);
    }

    rx = clamp(rx, 100, W - 100);

    var ry;
    if (t === "drone") {
      ry = 550 + Math.random() * 850;
    } else {
      var candidateY = Math.random() < 0.45 ? 950 : Math.random() < 0.75 ? GY : SY;
      var gSol = groundBelow(rx, candidateY);
      ry = gSol ? gSol.y : GY;
    }
    var baseHp = (t === "daisy" ? 46 : t === "soldier" ? 58 : 40) * hpMult;
    ents.push({
      t: t,
      x: rx,
      y: ry,
      bx: rx,
      by: ry,
      hp: baseHp,
      max: baseHp,
      dead: false,
      fire: 4.5 + Math.random() * 3.0, // Ampia pausa iniziale: devono correre attraverso la citta'
      ph: Math.random() * 6.28,
      hit: 0,
      vx: 0,
      dir: (rx < P.x ? 1 : -1),
      bob: 0
    });
  }
}

function nextEndlessWave(){
  G.wave++;
  G.waveKills = 0;
  var count = 18 + (G.wave - 1) * 8;
  G.waveTotal = count;
  G.corruption = Math.min(100, 5 + (G.wave - 1) * 8);
  G.hp = Math.min(G.maxhp, G.hp + 3);
  G.shake = 12;

  toast(T("ONDATA ","WAVE ") + G.wave + T(" · CORRUZIONE: "," · CORRUPTION: ") + G.corruption + T("% · ORDA NEMICA: ","% · ENEMY HORDE: ") + count, 4.2);
  if(typeof SFX!=="undefined") SFX.win();
  spawnEndlessWave(G.wave);
}

var coyote=0;
function updatePlayer(){
  var walk=430,run=690,acc=3600;
  if(P.dead)return;
  var want=(hitKey("d","arrowright")?1:0)-(hitKey("a","arrowleft")?1:0);
  var up=hitKey("w","arrowup"),down=hitKey("s","arrowdown");
  var lad=ladderAt(P.x,P.y);
  P.invuln=Math.max(0,P.invuln-dt);
  P.cd=Math.max(0,P.cd-dt);
  P.swing=Math.max(0,P.swing-dt);
  P.recoil=Math.max(0,P.recoil-dt*4);
  P.muzzle=Math.max(0,P.muzzle-dt);
  P.blink-=dt;
  if(P.blink<-0.4&&Math.random()<dt*0.4)P.blink=0.14;
  /* --- la scala --- */
  if(P.onLadder&&!lad)P.onLadder=false;
  if(P.onLadder){
    P.x=lerp(P.x,lad.x,0.35);
    P.vy=up?-300:down?300:0;
    P.y+=P.vy*dt;
    if(P.y<=lad.y1&&!down){P.y=lad.y1;P.onLadder=false;P.vy=0;P.ground=true;}
    else if(P.y>=lad.y0&&!up){P.y=lad.y0;P.onLadder=false;P.vy=0;P.ground=true;}
    if(hitKey("space")){P.onLadder=false;P.vy=-520;P.ground=false;if(typeof SFX!=="undefined")SFX.jump();}
    P.phase+=dt*3;P.state="climb";P.speed=0;P.vx=0;
    return;
  }
  if(lad&&(up||down)){P.onLadder=true;return;}
  /* --- passo --- */
  if(want!==0){P.vx+=want*acc*dt;P.dir=want;}
  else P.vx-=P.vx*Math.min(1,13*dt);
  var lim=keys["shift"]?run:walk;
  P.vx=clamp(P.vx,-lim,lim);
  var nx=P.x+P.vx*dt,s=hitsAt(nx,P.y,P.w,P.h);
  if(s){nx=P.vx>0?s.x-P.w/2-0.2:s.x+s.w+P.w/2+0.2;P.vx=0;}
  P.x=clamp(nx,26,W-26);
  /* --- salto --- */
  if(P.ground)coyote=0.11;else coyote=Math.max(0,coyote-dt);
  if(hitKey("space")&&coyote>0){P.vy=-880;P.ground=false;coyote=0;if(typeof SFX!=="undefined")SFX.jump();}
  P.vy=Math.min(P.vy+2150*dt,1600);
  var ny=P.y+P.vy*dt,sy=hitsAt(P.x,ny,P.w,P.h);
  var wasGround = P.ground;
  P.ground=false;
  if(sy){
    if(P.vy>0){
      ny=sy.y;P.ground=true;
      if(!wasGround && P.vy > 280 && typeof SFX!=="undefined") SFX.land();
    }
    else{ny=sy.y+sy.h+P.h;P.vy=0;}
  }
  if(ny>H-30){
    if(!wasGround && P.vy > 280 && typeof SFX!=="undefined") SFX.land();
    ny=H-30;P.ground=true;
  }
  P.y=ny;
  /* passi */
  if(P.ground && Math.abs(P.vx) > 35){
    P.stepT = (P.stepT || 0) + dt;
    if(P.stepT > (keys["shift"] ? 0.22 : 0.34)){
      P.stepT = 0;
      if(typeof SFX!=="undefined") SFX.step();
    }
  } else {
    P.stepT = 0.16;
  }
  /* --- pericolo radiazioni e fanghi tossici --- */
  var inToxic = false;
  for (var tsi = 0; tsi < SOL.length; tsi++) {
    var tsol = SOL[tsi];
    if (tsol.k === "toxic" && P.x >= tsol.x && P.x <= tsol.x + tsol.w && P.y >= tsol.y - 12 && P.y <= tsol.y + tsol.h + 20) {
      inToxic = true;
      break;
    }
  }
  if (inToxic) {
    P.toxicContact = (P.toxicContact || 0) + dt;
    if (P.toxicContact > 0.85) {
      P.toxicContact = 0;
      hurtP(1);
      toast("RADIAZIONE CRITICA · FANGHI TOSSICI", 1.8);
    }
  } else {
    P.toxicContact = 0;
  }
  /* --- lo stato del corpo --- */
  P.speed=Math.abs(P.vx);
  if(!P.ground)P.state="jump";
  else if(P.speed>500)P.state="run";
  else if(P.speed>14)P.state="walk";
  else P.state="idle";
  P.phase+=(Math.min(P.speed,700)/70)*dt*7.5;
  if(P.speed<14)P.phase+=dt*0.7;
  var bounce=(P.state==="walk"||P.state==="run")?Math.sin(P.phase*2)*0.16:0;
  var targetEar=-0.4*P.dir*(P.speed/690)+bounce*0.5;
  P.earV+=(targetEar-P.earA)*46*dt;P.earV*=Math.pow(0.02,dt);P.earA+=P.earV*dt;
  P.ear2V+=(targetEar*1.35-P.ear2A)*38*dt-P.earV*0.3;P.ear2V*=Math.pow(0.02,dt);P.ear2A+=P.ear2V*dt;
  P.tailV+=(-P.dir*0.25*(0.3+P.speed/690)-P.tailA)*30*dt;P.tailV*=Math.pow(0.05,dt);P.tailA+=P.tailV*dt;
  var tb=Math.abs(Math.sin(P.phase*2))*(P.speed>14?4:0);
  P.bodyV+=(tb-P.bodyY)*90*dt;P.bodyV*=Math.pow(0.01,dt);P.bodyY+=P.bodyV*dt;

function triggerEyeTimeFreeze(){
  if (G.timeFrozen) {
    unfreezeTime();
    return;
  }
  if ((G.eyeCooldown || 0) > 0) {
    toast(T("L'OCCHIO SI STA RICARICANDO · ", "THE EYE IS RECHARGING · ") + Math.ceil(G.eyeCooldown) + "s", 1.8);
    return;
  }
  G.timeFrozen = true;
  G.freezeTimer = 10.0;
  G.eyeCooldown = 22.0;
  G.shake = 9;
  G.flash = 0.8;
  if(typeof SFX !== "undefined") SFX.timeFreeze();
  toast(T("L'OCCHIO ATTIVATO · TEMPO FERMO PER 10s · SPARA AI NEMICI", "THE EYE ACTIVATED · TIME FROZEN FOR 10s · SHOOT ENEMIES"), 3.2);
}

function unfreezeTime(){
  if (!G.timeFrozen) return;
  G.timeFrozen = false;
  G.freezeTimer = 0;
  G.shake = 12;
  G.flash = 0.9;
  if(typeof SFX !== "undefined") SFX.timeResume();
  toast(T("TEMPO RIPARTITO · IL DANNO SI SCATENA!", "TIME RESUMED · DAMAGE UNLEASHED!"), 2.4);

  // Applica eventuale danno da spada sferrato durante la stasi
  for(var i = 0; i < ents.length; i++){
    var e = ents[i];
    if (e.dead) continue;
    if (e.frozenDmg && e.frozenDmg > 0) {
      hurtEnemy(e, e.frozenDmg, e.x, e.y - 35);
      e.frozenDmg = 0;
    }
  }

  }
  if(!w.flame){
    for(i=0;i<5;i++)parts.push({x:P.x+Math.cos(a)*38,y:P.y-56+Math.sin(a)*38,

function updateBullets(){
  var i,j,b,e,dx,dy,gone;
  for(i=bul.length-1;i>=0;i--){
    b=bul[i];
    if(b.frozen){
      if(!G.timeFrozen){

      } else {
        continue;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.flame){
      b.vx*=Math.pow(0.05,dt);b.vy=b.vy*Math.pow(0.05,dt)-120*dt;
      if(Math.random()<dt*40)parts.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*40,vy:-40-Math.random()*60,life:0.4,max:0.4,col:"#ff9a3c",r:Math.random()*7+3});
    }
    if(b.life<=0||b.x<-60||b.x>W+60||b.y<-60||b.y>H+60){bul.splice(i,1);continue;}
    if(!b.flame&&hitsAt(b.x,b.y,7,7)){
      for(j=0;j<5;j++)parts.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,life:0.24,max:0.24,col:b.col,r:1.6});
      bul.splice(i,1);continue;
    }
    gone=false;
    for(j=0;j<ents.length;j++){
      e=ents[j];
      if(e.dead)continue;

      if(dx*dx+dy*dy<42*42){hurtEnemy(e,b.dmg,b.x,b.y);bul.splice(i,1);gone=true;break;}
    }
  }
  for(i=eb.length-1;i>=0;i--){
    b=eb[i];
    if(G.timeFrozen){
      continue;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){eb.splice(i,1);continue;}
    if(hitsAt(b.x,b.y,7,7)){

      eb.splice(i,1);continue;
    }
    dx=b.x-P.x;dy=b.y-(P.y-52);
    if(dx*dx+dy*dy<34*34){eb.splice(i,1);hurtP(1);}
  }
}

function findLadderForEnemy(ex, ey, needUp){
  var best = null, bestDist = 1e9;
  for(var i = 0; i < LAD.length; i++){
    var l = LAD[i];
    // l.y0 e' la base in basso (numero maggiore), l.y1 e' la cima in alto (numero minore)
    if(needUp){
      if(l.y1 < ey - 20 && ey >= l.y1 - 35 && ey <= l.y0 + 35){
        var dist = Math.abs(ex - l.x);
        if(dist < bestDist){
          bestDist = dist;
          best = l;
        }
      }
    } else {
      if(l.y0 > ey + 20 && ey >= l.y1 - 35 && ey <= l.y0 + 35){
        var dist2 = Math.abs(ex - l.x);
        if(dist2 < bestDist){
          bestDist = dist2;
          best = l;
        }
      }
    }
  }
  return best;
}

function updateWalkingEnemy(e, moveSpeed, climbSpeed, dt){
  var dx = P.x - e.x;
  var dy = P.y - e.y;
  var needVertical = Math.abs(dy) > 70;

  if(e.onLadder){
    var lad = e.ladderObj;
    if(!lad || Math.abs(e.x - lad.x) > 50){
      e.onLadder = false;
      e.ladderObj = null;
    } else {
      var goingUp = (P.y < e.y);
      e.x = lerp(e.x, lad.x, Math.min(1, 14 * dt));
      e.y += (goingUp ? -1 : 1) * climbSpeed * dt;
      e.by = e.y;
      e.dir = dx >= 0 ? 1 : -1;

      if(goingUp && e.y <= lad.y1 + 4){
        e.y = lad.y1;
        e.by = e.y;
        e.onLadder = false;
        e.ladderObj = null;
      } else if(!goingUp && e.y >= lad.y0 - 4){
        e.y = lad.y0;
        e.by = e.y;
        e.onLadder = false;
        e.ladderObj = null;
      } else if(Math.abs(P.y - e.y) < 25){
        e.onLadder = false;
        e.ladderObj = null;
      }
      return;
    }
  }

  if(needVertical){
    var wantUp = (dy < 0);
    var ladFound = findLadderForEnemy(e.x, e.y, wantUp);
    if(ladFound){
      if(Math.abs(e.x - ladFound.x) < 26){
        e.onLadder = true;
        e.ladderObj = ladFound;
        e.x = ladFound.x;
      } else {
        e.dir = (ladFound.x > e.x) ? 1 : -1;
        e.x += e.dir * moveSpeed * dt;
      }
    } else {
      e.dir = dx >= 0 ? 1 : -1;
      e.x += e.dir * moveSpeed * dt;
    }
  } else {
    e.dir = dx >= 0 ? 1 : -1;
    e.x += e.dir * moveSpeed * dt;
  }

  if(!e.onLadder){
    var gSol = groundBelow(e.x, e.y - 12);
    if(gSol){
      if(e.y < gSol.y){
        e.y = Math.min(gSol.y, e.y + 820 * dt);
      } else if(e.y > gSol.y + 4){
        e.y = gSol.y;
      }
      e.by = e.y;
    } else {
      e.y = Math.min(SY, e.y + 880 * dt);
      e.by = e.y;
    }
  }

  e.x = clamp(e.x, 30, W - 30);
}

function updateEnemies(){
  if(G.timeFrozen) return; // Nemici congelati nel tempo!
  var i,e,dx,dy,d,act;
  var isEndless = IS_ENDLESS || (typeof G !== 'undefined' && G.endless);
  var waveLvl = (typeof G !== 'undefined' && G.wave) || 1;

  for(i=0;i<ents.length;i++){
    e=ents[i];
    e.ph+=dt;e.hit=Math.max(0,e.hit-dt);
    if(e.dead)continue;
    dx=P.x-e.x;dy=P.y-e.y;d=Math.sqrt(dx*dx+dy*dy);

    // TUTTI I NEMICI USANO LE SCALE E INSEGUONO IL GIOCATORE IN TUTTE LE MODALITÀ!
    // In Gioco Infinito: allerta globale continua.
    // Nelle Missioni 1-8: i nemici si attivano appena il giocatore si avvicina (<850px),
    // se subiscono colpi, se l'Occhio è attivo, o se sono già su una scala.
    if(isEndless){
      act = !P.dead && G.daisy <= 0;
    } else {
      if(!P.dead && G.daisy <= 0){
        if(e.onLadder || e.hit > 0 || G.eyeOn || d < 850){
          e.alerted = true;
        } else if(d > 1400){
          e.alerted = false;
        }
        act = !!e.alerted;
      } else {
        act = false;
      }
    }

    if(e.t==="daisy"){
      if(act){
        var daisySpd = isEndless ? (200 + Math.min(160, waveLvl * 14)) : 135;
        var daisyClimb = isEndless ? (180 + Math.min(130, waveLvl * 10)) : 140;
        updateWalkingEnemy(e, daisySpd, daisyClimb, dt);
      } else if(!isEndless) {
        e.x += Math.sin(e.ph * 0.7) * 26 * dt;
        e.x = clamp(e.x, e.bx - 120, e.bx + 120);
        e.y = e.by + Math.sin(e.ph * 3.2) * 2.5;
      }
      if(d < 56 && Math.abs(dy) < 80) hurtP(1);
    } else if(e.t==="soldier"){
      e.fire -= dt;
      if(act){
        var sldSpd = isEndless ? (135 + Math.min(130, waveLvl * 10)) : 110;
        var sldClimb = isEndless ? (145 + Math.min(120, waveLvl * 9)) : 125;
        updateWalkingEnemy(e, sldSpd, sldClimb, dt);

        var fireDist = isEndless ? 1400 : 850;
        if(!e.onLadder && e.fire <= 0 && Math.abs(dx) < fireDist && Math.abs(dy) < 320){
          e.fire = (isEndless ? (1.0 + rnd(i*1.1)*0.6) : (1.9 + rnd(i*1.3)*0.9)) / (1 + (isEndless ? waveLvl * 0.06 : 0));
          shootAt(e, isEndless ? 350 : 300);
        }
      } else if(!isEndless){
        e.dir = dx >= 0 ? 1 : -1;
      }
    } else {
      // Droni (volano in 2D inseguendo il giocatore tra i vari livelli)
      if(act){
        var drSpd = isEndless ? (150 + Math.min(160, waveLvl * 12)) : 100;
        var ang = Math.atan2(dy - 40, dx);
        e.x += Math.cos(ang) * drSpd * dt;
        e.y += Math.sin(ang) * drSpd * dt;
        e.x = clamp(e.x, 30, W - 30);
        e.dir = dx >= 0 ? 1 : -1;
        e.fire -= dt;
        if(e.fire <= 0 && d < (isEndless ? 950 : 660)){
          e.fire = (isEndless ? (1.2 + rnd(i*2.2)*0.8) : (2.3 + rnd(i*3.7)*1.0)) / (1 + (isEndless ? waveLvl * 0.05 : 0));
          shootAt(e, isEndless ? 320 : 260);
        }
        if(d < 52) hurtP(1);
      } else if(!isEndless) {
        e.x += Math.sin(e.ph * 0.8) * 30 * dt;
        e.y = e.by + Math.sin(e.ph * 1.6) * 18;
      }
    }
  }
}

function takeNote(n){
  n.got=true;

  a.pages=a.pages||{};a.pages[n.id]=(a.pages[n.id]||0)+1;
  a.seen=a.seen||{};a.seen[n.id]=true;
  /* la nota si porta dietro quello che c'è scritto: etichetta, frase e
     il foglio intero. Il museo non ha la strada sotto mano, e senza
     questo nel computer di bordo resterebbe solo un numero. */
  a.noteText=a.noteText||{};
  a.noteText[n.id]={l:n.l,q:n.q,b:n.b||""};
  saveJ(SAVE_A,a);
  toast(T("PAGINA DEL LIBRO · ", "BOOK PAGE · ") + n.l + T(" — ricopiata nel computer di bordo", " — copied to onboard computer"), 4.6);
  G.flash=0.3;
  for(var i=0;i<22;i++)parts.push({x:n.x,y:n.y-14,vx:(Math.random()-0.5)*230,vy:-Math.random()*260,life:0.9,max:0.9,col:"#e8dcc0",r:2+Math.random()*2});
}
function winMission(){

function updateEye(){
  /* L'occhio nel cielo segue dolcemente il giocatore attraverso la mappa */
  G.eyeX=lerp(G.eyeX,P.x,Math.min(1,dt*2.2));
  G.eyeY=lerp(G.eyeY,120+Math.sin(time*1.5)*14,Math.min(1,dt*2.0));
  if(!G.eyeOn)return;
  G.eyeT-=dt;
  if(G.eyeT<=10){
    G.eyeBlink-=dt;
    if(G.eyeBlink<-0.5&&Math.random()<dt*3){
      G.eyeBlink=0.16;
      if(typeof SFX!=="undefined") SFX.eyePulse();
    }
  }
  if(G.eyeT<=0){G.eyeT=0;G.eyeOn=false;startDaisy("L'OCCHIO TI HA VISTO");}
}
function updateParts(){
  var i,p;
  for(i=parts.length-1;i>=0;i--){
    p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vy+=900*dt;p.vx*=Math.pow(0.4,dt);
    p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
}

function skyline(par,baseY,hs,col,windows){
  var i,d,x,y,h,wy,wx;
  for(i=0;i<DECO.length;i++){
    d=DECO[i];
    x=d.x-camx*par;
    if(x>VW+240||x+d.w<-240)continue;
    y=baseY-camy*par*0.55;
    h=d.h*hs;
    ctx.fillStyle=col;
    ctx.fillRect(x,y-h,d.w,h);
    ctx.fillStyle="rgba(255,255,255,0.035)";
    ctx.fillRect(x,y-h,d.w,1.5);
    if(windows){
      for(wy=0;wy<Math.floor(h/46);wy++){
        for(wx=0;wx<Math.floor(d.w/26);wx++){
          if(rnd(d.seed*7.1+wy*3.3+wx*1.7)<0.62)continue;
          ctx.fillStyle=rnd(d.seed+wy+wx)<0.5?"rgba(255,204,132,0.5)":"rgba(160,214,236,0.35)";
          ctx.fillRect(x+9+wx*26,y-h+16+wy*46,7,11);
        }
      }
    }
  }
}

/* ============================================================

function getEffectiveVisualMem(){
  if (IS_ENDLESS || (typeof G !== 'undefined' && G.endless)) {
    return Math.min(8, 5 + Math.floor(((G.wave || 1) - 1) * 0.8));
  }
  return MEM;
}

function drawCosmicEyesInSky(){
  var effMem = getEffectiveVisualMem();
  if(effMem < 5) return;
  var eyes = [
    { x: VW * 0.22, y: 130, sz: 38, speed: 1.2, off: 0 },
    { x: VW * 0.82, y: 175, sz: 48, speed: 0.9, off: 2.1 },
    { x: VW * 0.52, y: 95, sz: 58, speed: 1.5, off: 4.3 }
  ];
  var count = (effMem === 5) ? 1 : (effMem === 6) ? 2 : 3;

  for(var i = 0; i < count; i++){
    var e = eyes[i];
    var ex = ((e.x - camx * 0.08) % (VW + 200) + (VW + 200)) % (VW + 200) - 100;
    var ey = e.y - camy * 0.06;
    if(ey > VH * 0.65) continue;

    ctx.save();
    ctx.translate(ex, ey);

    // Eyelid blink animation
    var blink = Math.sin(time * e.speed + e.off);
    var open = Math.max(0.08, Math.abs(blink));

    var irisCols = [
      "rgba(74, 222, 128, ",  // M5: acid green
      "rgba(192, 132, 252, ", // M6: electric violet
      "rgba(244, 63, 94, ",   // M7: crimson red
      "rgba(255, 45, 115, "   // M8: hyper void
    ];
    var irisCol = irisCols[Math.min(3, Math.max(0, effMem - 5))];

    var glow = ctx.createRadialGradient(0, 0, 2, 0, 0, e.sz * 1.8);
    glow.addColorStop(0, irisCol + "0.35)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(-e.sz * 2, -e.sz * 2, e.sz * 4, e.sz * 4);

    // Eye contour
    ctx.fillStyle = "#08060a";
    ctx.beginPath();
    ctx.moveTo(-e.sz, 0);
    ctx.quadraticCurveTo(0, -e.sz * 0.65 * open, e.sz, 0);
    ctx.quadraticCurveTo(0, e.sz * 0.65 * open, -e.sz, 0);
    ctx.fill();

    // Horror twitching veins
    ctx.strokeStyle = irisCol + "0.45)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-e.sz * 0.85, 0); ctx.lineTo(-e.sz * 0.35, Math.sin(time * 2 + i) * 3);
    ctx.moveTo(e.sz * 0.85, 0); ctx.lineTo(e.sz * 0.35, -Math.sin(time * 2 + i) * 3);
    ctx.stroke();

    // Glowing Iris & Slit Pupil
    if(open > 0.2){
      ctx.fillStyle = irisCol + "0.85)";
      ctx.beginPath();
      ctx.arc(0, 0, e.sz * 0.35 * open, 0, 6.28);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.ellipse(0, 0, e.sz * 0.09, e.sz * 0.32 * open, 0, 0, 6.28);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawPsychedelicAurora(){
  var effMem = getEffectiveVisualMem();
  if(effMem < 6) return;
  ctx.save();
  var waves = (effMem >= 8) ? 4 : (effMem === 7) ? 3 : 2;
  for(var w = 0; w < waves; w++){
    var yBase = 60 + w * 45;
    ctx.beginPath();
    ctx.moveTo(0, yBase);
    for(var x = 0; x <= VW; x += 30){
      var y = yBase + Math.sin(x * 0.008 + time * 1.8 + w * 1.5) * 22 + Math.cos(x * 0.015 - time * 1.2) * 14;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VW, 0);
    ctx.lineTo(0, 0);
    var aCols = [
      "rgba(168, 85, 247, 0.12)",
      "rgba(236, 72, 153, 0.14)",
      "rgba(56, 189, 248, 0.15)",
      "rgba(244, 63, 94, 0.16)"
    ];
    ctx.fillStyle = aCols[(w + effMem) % aCols.length];
    ctx.fill();
  }
  ctx.restore();
}

function drawHorrorTendrils(s){
  var effMem = getEffectiveVisualMem();
  if(effMem < 5) return;
  var x = s.x - camx, y = s.y - camy, w = s.w, h = s.h;
  if(x > VW + 100 || x + w < -100 || y > VH + 100 || y + h < -100) return;
  ctx.save();
  var tendrilCols = [
    "rgba(74, 222, 128, 0.45)",  // M5: bio green
    "rgba(192, 132, 252, 0.50)", // M6: psycho violet
    "rgba(244, 63, 94, 0.55)",   // M7: crimson blood
    "rgba(255, 45, 115, 0.65)"   // M8: hyper void
  ];
  var col = tendrilCols[Math.min(3, Math.max(0, effMem - 5))];
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  var step = 85;
  for(var tx = 0; tx < w; tx += step){
    var px = x + tx;
    var wave = Math.sin(time * 2.5 + tx * 0.05) * 6;
    ctx.moveTo(px, y);
    ctx.quadraticCurveTo(px + 15, y - 18 + wave, px + 30, y - 2);
    if((tx / step) % 2 === 0){
      ctx.fillStyle = col;
      ctx.fillRect(px + 12, y - 14 + wave, 3, 3);
    }
  }
  ctx.stroke();
  ctx.restore();
}

function drawPsychedelicGlitchPass(){
  var effMem = getEffectiveVisualMem();
  var glitchIntensity = (IS_ENDLESS || (typeof G !== 'undefined' && G.endless)) 
    ? Math.min(1.0, 0.25 + ((G.wave || 1) - 1) * 0.12) 
    : (effMem - 1) / 7.0;
  var t = time;

  // 1. Horror Pulsing Vignette
  var vigColors = [
    "rgba(0,0,0,0.38)",               // M1
    "rgba(10,30,15,0.44)",            // M2 (acid)
    "rgba(35,25,5,0.48)",             // M3 (sulfur)
    "rgba(45,15,5,0.54)",             // M4 (fallout orange)
    "rgba(5,45,20,0.60)",             // M5 (bio viridian)
    "rgba(40,5,65,0.66)",             // M6 (psychedelic violet)
    "rgba(65,4,12,0.72)",             // M7 (crimson nightmare)
    "rgba(55,0,35,0.80)"              // M8 (cosmic void)
  ];
  var vigCol = vigColors[Math.min(7, Math.max(0, effMem - 1))];
  var pulse = 1.0 + 0.07 * Math.sin(t * 3.5);
  var vg = ctx.createRadialGradient(VW/2, VH/2, 180 * pulse, VW/2, VH/2, 620);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, vigCol);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);

  // 2. CRT Scanlines (scaling with effMem)
  var scanAlpha = 0.025 + glitchIntensity * 0.085;
  ctx.fillStyle = "rgba(0,0,0," + scanAlpha + ")";
  var scanStep = (effMem >= 5) ? 3 : 4;
  for(var sy = 0; sy < VH; sy += scanStep){
    ctx.fillRect(0, sy, VW, 1);
  }

  // 3. Chromatic Aberration & VHS Horizontal Slice Tears (M3 -> M8)
  if(effMem >= 3){
    var glitchChance = 0.08 + glitchIntensity * 0.38 + (P.invuln > 0 ? 0.35 : 0);
    if(Math.random() < glitchChance){
      var numSlices = Math.floor(1 + Math.random() * (effMem * 1.3));
      for(var s = 0; s < numSlices; s++){
        var sliceY = Math.random() * (VH - 35);
        var sliceH = Math.random() * (10 + effMem * 6) + 4;
        var offset = (Math.random() - 0.5) * (8 + glitchIntensity * 32);

        ctx.save();
        ctx.globalCompositeOperation = (effMem >= 6) ? "difference" : "screen";
        var rCol = (effMem % 2 === 0) ? "rgba(255,0,90,0.18)" : "rgba(0,255,210,0.18)";
        ctx.fillStyle = rCol;
        ctx.fillRect(offset, sliceY, VW, sliceH);
        ctx.restore();

        // High frequency static displacement line
        ctx.fillStyle = (Math.random() < 0.5) ? "rgba(255,255,255,0.14)" : "rgba(0,0,0,0.25)";
        ctx.fillRect(0, sliceY, VW, 1.5);
      }
    }
  }

  // 4. Floating Glitch Artifact Blocks & Corrupted Data Matrices (M4 -> M8)
  if(effMem >= 4){
    var blockCount = Math.floor((effMem - 3) * 2.8);
    for(var b = 0; b < blockCount; b++){
      if(Math.random() < 0.38){
        var bx = Math.random() * VW;
        var by = Math.random() * VH;
        var bw = 8 + Math.random() * 42;
        var bh = 3 + Math.random() * 10;
        var bColors = ["rgba(255,40,120,0.45)", "rgba(50,255,180,0.45)", "rgba(255,220,50,0.45)", "rgba(180,50,255,0.45)"];
        ctx.fillStyle = bColors[Math.floor(Math.random() * bColors.length)];
        ctx.fillRect(bx, by, bw, bh);
      }
    }
  }

  // 5. Inverted Flash Frames & Reality Warps (M7 -> M8)
  if(effMem >= 7 && Math.random() < 0.025){
    ctx.save();
    ctx.globalCompositeOperation = "difference";
    ctx.fillStyle = "rgba(255,255,255,0.40)";
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  }
}

function drawSky(){

    sy = ((s.y - camy * 0.12) % VH + VH) % VH;

  for (i = 0; i < 3; i++) ctx.fillRect(0, VH * 0.55 + i * 74 + Math.sin(time * 0.35 + i) * 9, VW, 46);

  /* ---- le orecchie: due molle ---- */

/* le quattro armi, viste di lato, in mano al coniglio */
function drawWeapon(s){
  var w=curW(),rec=P.recoil*7*s;
  ctx.translate(-rec,0);
  if(w.id==="pistol"){
    ctx.fillStyle="#1b2226";ctx.fillRect(4*s,-4*s,26*s,9*s);
    ctx.fillStyle="#2b363c";ctx.fillRect(28*s,-2.6*s,9*s,5*s);
    ctx.fillStyle="#151b1f";ctx.fillRect(8*s,4*s,8*s,12*s);
    ctx.fillStyle="rgba(232,180,74,0.75)";ctx.fillRect(14*s,-3.4*s,6*s,2*s);
  }else if(w.id==="smg"){
    ctx.fillStyle="#1b2226";ctx.fillRect(0,-5*s,42*s,11*s);
    ctx.fillStyle="#2b363c";ctx.fillRect(42*s,-3*s,12*s,6*s);
    ctx.fillStyle="#151b1f";
    ctx.save();ctx.translate(16*s,6*s);ctx.rotate(0.22);ctx.fillRect(0,0,9*s,18*s);ctx.restore();
    ctx.fillStyle="#151b1f";ctx.fillRect(-12*s,-3*s,14*s,6*s);
    ctx.fillStyle="rgba(232,180,74,0.7)";ctx.fillRect(24*s,-4.4*s,10*s,2*s);
  }else if(w.id==="flame"){
    ctx.fillStyle="#2a1c14";ctx.beginPath();ctx.arc(-6*s,2*s,9*s,0,6.3);ctx.fill();
    ctx.fillStyle="#1b2226";ctx.fillRect(0,-4.5*s,34*s,9*s);
    ctx.fillStyle="#2b363c";ctx.fillRect(34*s,-2.5*s,11*s,5*s);
    ctx.fillStyle="rgba(255,154,60,0.9)";
    ctx.beginPath();ctx.arc(46*s,0,2.4*s+Math.sin(time*22)*1.4*s,0,6.3);ctx.fill();
  }else if(w.id==="eye"||w.timeFreeze){
    /* ============================================================
       L'OCCHIO TEMPORALE IN MANO AL CONIGLIO (NON È UNA SPADA!)
       Un bulbo oculare cosmico e cibernetico che fluttua sulle zampe,
       circondato da anelli giroscopici di stasi e fulmini temporali.
       ============================================================ */
    var ex=28*s, ey=Math.sin(time*5)*3.2*s;
    ctx.save();

    // 1. Manicotto cibernetico impugnato dal coniglio
    ctx.fillStyle="#0f172a";
    ctx.fillRect(0,-4*s,14*s,8*s);
    ctx.fillStyle="#e8b44a";
    ctx.fillRect(12*s,-3.5*s,4*s,7*s);
    ctx.fillStyle="#334155";
    ctx.beginPath();ctx.arc(16*s,0,5.5*s,-1.57,1.57);ctx.fill();

    // 2. Alone di curvatura temporale
    var auraRad = (G.timeFrozen ? 42 : 28)*s;
    var aG=ctx.createRadialGradient(ex,ey,2*s,ex,ey,auraRad);
    aG.addColorStop(0,G.timeFrozen?"rgba(192,132,252,0.85)":"rgba(168,85,247,0.5)");
    aG.addColorStop(0.5,G.timeFrozen?"rgba(56,189,248,0.4)":"rgba(147,51,234,0.18)");
    aG.addColorStop(1,"rgba(147,51,234,0)");
    ctx.fillStyle=aG;
    ctx.beginPath();ctx.arc(ex,ey,auraRad,0,6.28);ctx.fill();

    // 3. Anelli giroscopici rotanti di stasi temporale
    var rRot1 = time * 2.4, rRot2 = -time * 3.1;
    ctx.strokeStyle="rgba(192,132,252,0.85)";ctx.lineWidth=1.8*s;
    ctx.beginPath();ctx.ellipse(ex,ey,22*s,9*s,rRot1,0,6.28);ctx.stroke();
    ctx.strokeStyle="rgba(56,189,248,0.75)";ctx.lineWidth=1.4*s;
    ctx.beginPath();ctx.ellipse(ex,ey,17*s,22*s,rRot2,0,6.28);ctx.stroke();

    // Nodi di energia sui perimetri orbitali
    var nx1 = ex + Math.cos(rRot1)*22*s, ny1 = ey + Math.sin(rRot1)*9*s;
    ctx.fillStyle="#c084fc";ctx.beginPath();ctx.arc(nx1,ny1,2.4*s,0,6.28);ctx.fill();
    var nx2 = ex + Math.cos(rRot2)*17*s, ny2 = ey + Math.sin(rRot2)*22*s;
    ctx.fillStyle="#38bdf8";ctx.beginPath();ctx.arc(nx2,ny2,2*s,0,6.28);ctx.fill();

    // 4. Bulbo Oculare (Sclera)
    var eyeG=ctx.createRadialGradient(ex-3*s,ey-2*s,1,ex,ey,15*s);
    eyeG.addColorStop(0,"#ffffff");
    eyeG.addColorStop(0.65,"#f1f5f9");
    eyeG.addColorStop(1,G.timeFrozen?"#d8b4fe":"#cbd5e1");
    ctx.fillStyle=eyeG;
    ctx.beginPath();ctx.ellipse(ex,ey,14*s,11*s,0,0,6.28);ctx.fill();
    ctx.strokeStyle=G.timeFrozen?"#c084fc":"#475569";ctx.lineWidth=1.4*s;ctx.stroke();

    // 5. Vene di crono-energia pulsanti
    ctx.strokeStyle=G.timeFrozen?"rgba(192,132,252,0.75)":"rgba(244,63,94,0.6)";
    ctx.lineWidth=0.9*s;
    ctx.beginPath();
    ctx.moveTo(ex-12*s,ey-3*s);ctx.lineTo(ex-4*s,ey-1*s);
    ctx.moveTo(ex-11*s,ey+4*s);ctx.lineTo(ex-3*s,ey+2*s);
    ctx.stroke();

    // 6. Iride Luminosa (fissa lungo la linea di puntamento del mouse)
    var ix = ex + 4.5*s, iy = ey;
    var irisG=ctx.createRadialGradient(ix,iy,1,ix,iy,7.5*s);
    irisG.addColorStop(0,G.timeFrozen?"#ffffff":"#c084fc");
    irisG.addColorStop(0.45,G.timeFrozen?"#a855f7":"#38bdf8");
    irisG.addColorStop(0.85,"#4338ca");
    irisG.addColorStop(1,"#0f172a");
    ctx.fillStyle=irisG;
    ctx.beginPath();ctx.arc(ix,iy,7*s,0,6.28);ctx.fill();

    // 7. Pupilla
    var pupRad = (G.timeFrozen ? 3.8 : 3.0)*s;
    ctx.fillStyle="#020617";
    ctx.beginPath();ctx.arc(ix+0.8*s,iy,pupRad,0,6.28);ctx.fill();

    // 8. Riflesso bianco lucido
    ctx.fillStyle="#ffffff";
    ctx.beginPath();ctx.arc(ix-0.8*s,iy-2.4*s,1.4*s,0,6.28);ctx.fill();

    // 9. Scariche di fulmini temporali quando il tempo è congelato
    if(G.timeFrozen){
      ctx.strokeStyle="rgba(56,189,248,0.9)";ctx.lineWidth=1.2*s;
      for(var l=0;l<4;l++){
        var la = l*1.57 + time*12;
        var lx1 = ex + Math.cos(la)*14*s, ly1 = ey + Math.sin(la)*11*s;
        var lx2 = ex + Math.cos(la)*26*s + (Math.random()-0.5)*8*s;
        var ly2 = ey + Math.sin(la)*26*s + (Math.random()-0.5)*8*s;
        ctx.beginPath();ctx.moveTo(lx1,ly1);ctx.lineTo(lx2,ly2);ctx.stroke();
      }
    }
    ctx.restore();
  }else{
    ctx.fillStyle="#20272b";ctx.fillRect(-2*s,-2.6*s,22*s,5.2*s);
    ctx.fillStyle="#333d43";ctx.fillRect(18*s,-10*s,5*s,20*s);
    var bgr=ctx.createLinearGradient(22*s,0,110*s,0);
    bgr.addColorStop(0,"#cfd8dd");bgr.addColorStop(.5,"#eef4f7");bgr.addColorStop(1,"#9fb0b8");
    ctx.fillStyle=bgr;
    ctx.beginPath();
    ctx.moveTo(22*s,-2.4*s);ctx.lineTo(104*s,-1.2*s);ctx.lineTo(112*s,0);
    ctx.lineTo(104*s,1.2*s);ctx.lineTo(22*s,2.4*s);ctx.closePath();ctx.fill();
  }
  if(P.muzzle>0){
    var w2=curW();
    if(w2.id==="eye"||w2.timeFreeze){
      ctx.save();
      ctx.strokeStyle="rgba(192,132,252,0.95)";
      ctx.lineWidth=3*s;
      ctx.beginPath();ctx.arc(28*s,0,32*s,0,6.28);ctx.stroke();
      ctx.restore();
    } else {
      var tip=w2.id==="sword"?112*s:w2.id==="flame"?50*s:52*s;
      var mg=ctx.createRadialGradient(tip,0,1,tip,0,26*s);
      mg.addColorStop(0,"rgba(255,244,214,0.95)");
      mg.addColorStop(.4,"rgba(255,190,90,0.55)");
      mg.addColorStop(1,"rgba(255,160,60,0)");
      ctx.fillStyle=mg;ctx.beginPath();ctx.arc(tip,0,26*s,0,6.3);ctx.fill();
    }
  }
  if(P.swing>0&&w.id==="sword"){
    var k=1-P.swing/0.26;
    ctx.strokeStyle="rgba(240,248,252,"+(0.75*(1-k))+")";
    ctx.lineWidth=7*s;
    ctx.beginPath();ctx.arc(10*s,0,96*s,-1.1+k*1.6,0.35+k*1.6);ctx.stroke();
  }
}

function drawDaisy(e){
  var x=e.x-camx,y=e.y-camy;
  if(x<-90||x>VW+90||y<-140||y>VH+140)return;
  var sway=Math.sin(e.ph*2.4)*0.13,i;
  ctx.save();
  ctx.translate(x,y);
  if(e.onLadder){
    ctx.strokeStyle=e.hit>0?"#ffc0c0":"#4ade80";ctx.lineWidth=4;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-60);ctx.stroke();
  } else {
    ctx.strokeStyle=e.hit>0?"#ffc0c0":"#3f6b52";ctx.lineWidth=4;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sway*40,-30,sway*18,-60);ctx.stroke();
  }
  ctx.fillStyle=e.hit>0?"#ffb3b3":"#2f5540";
  ctx.save();ctx.translate(sway*24,-34);ctx.rotate(0.5);ctx.beginPath();ctx.ellipse(0,0,13,5,0,0,6.3);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(sway*20,-22);ctx.rotate(-2.4);ctx.beginPath();ctx.ellipse(0,0,11,4.4,0,0,6.3);ctx.fill();ctx.restore();
  ctx.save();
  ctx.translate(sway*14,-66);
  ctx.rotate(sway*0.6);
  for(i=0;i<12;i++){
    ctx.save();ctx.rotate(i/12*6.283);
    var pg=ctx.createLinearGradient(0,0,0,-26);
    pg.addColorStop(0,"rgba(255,255,252,0.95)");
    pg.addColorStop(1,"rgba(226,224,208,0.55)");

    ctx.beginPath();ctx.ellipse(0,-19,6.5,14,0,0,6.3);ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle=e.hit>0?"#ffd0d0":"#e8b44a";
  ctx.beginPath();ctx.arc(0,0,13,0,6.3);ctx.fill();
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.beginPath();ctx.arc(0,0,9,0,6.3);ctx.fill();
  var dx=P.x-e.x,dy=(P.y-52)-e.y;

  ctx.beginPath();ctx.arc(dx/dl*4.4-1.6,dy/dl*4.4-1.8,1.4,0,6.3);ctx.fill();
  ctx.restore();
  ctx.restore();

function drawEnemies(){
  var i,e,x,y;
  for(i=0;i<ents.length;i++){
    e=ents[i];
    if(e.dead)continue;
    if(e.t==="daisy")drawDaisy(e);

}

/* ============================================================
   L'OCCHIO NEL CIELO
   ============================================================ */
function drawEye(){
  /* L'occhio nel cielo: è sempre presente in alto nel cielo a osservare il coniglio.
     Segue il movimento del giocatore e la sua pupilla lo fissa continuamente.
     Quando si prende la cassetta (G.eyeOn) l'occhio diventa vigile, pulsa e scende il conto alla rovescia. */
  var on=G.eyeOn;
  var t=on?G.eyeT:999;
  var urgent=on&&(t<15);
  var pulse=urgent?0.5+0.5*Math.sin(time*8):0.5+0.5*Math.sin(time*1.4);

  /* Posizione dell'occhio a schermo: l'occhio in cielo insegue il giocatore con morbida inerzia */
  var ex=clamp(G.eyeX-camx,150,VW-150);
  var ey=G.eyeY;
  if(on){
    var chase=Math.min(1,Math.max(0,1-G.eyeT/(G.eyeMax||40)));
    ey+=chase*38;
  }

  var EK=on?(urgent?0.74:0.68):0.62;

  ctx.save();

  /* L'alone di luce nel cielo */
  var halo=ctx.createRadialGradient(ex,ey,20,ex,ey,340*EK);
  if(urgent){
    halo.addColorStop(0,"rgba(255,80,60,"+(0.35+0.25*pulse)+")");
    halo.addColorStop(0.5,"rgba(220,90,60,0.14)");
  }else if(on){
    halo.addColorStop(0,"rgba(245,210,140,0.24)");
    halo.addColorStop(0.5,"rgba(200,160,100,0.08)");
  }else{
    halo.addColorStop(0,"rgba(200,215,230,0.12)");
    halo.addColorStop(0.5,"rgba(160,180,200,0.04)");
  }
  halo.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(ex,ey,340*EK,0,6.3);ctx.fill();

  /* Palpebre */
  var lid=on?(1-Math.abs(Math.sin(time*0.7))*0.05):(0.76-Math.abs(Math.sin(time*0.4))*0.06);
  if(G.eyeBlink>0)lid=0.28;

  ctx.save();
  ctx.translate(ex,ey);
  ctx.scale(EK,EK*lid);

  /* Bulbo oculare */
  var sc=ctx.createRadialGradient(-30,-24,10,0,0,180);
  if(urgent){
    sc.addColorStop(0,"#fff2e8");sc.addColorStop(0.65,"#edd1be");sc.addColorStop(1,"#b5877b");
  }else{
    sc.addColorStop(0,"#fbf6ea");sc.addColorStop(0.65,"#ded4c2");sc.addColorStop(1,"#a89b88");
  }
  ctx.fillStyle=sc;
  ctx.beginPath();ctx.ellipse(0,0,178,112,0,0,6.3);ctx.fill();

  /* Vene che pulsano quando il tempo stringe */
  if(urgent){
    ctx.strokeStyle="rgba(220,40,40,"+(0.35+0.35*pulse)+")";ctx.lineWidth=2.2;
    var v;
    for(v=0;v<7;v++){
      var va=v/7*6.283;
      ctx.beginPath();
      ctx.moveTo(Math.cos(va)*150,Math.sin(va)*92);
      ctx.quadraticCurveTo(Math.cos(va+0.3)*100,Math.sin(va+0.3)*70,Math.cos(va+0.18)*60,Math.sin(va+0.18)*44);
      ctx.stroke();
    }
  }

  /* L'IRIDE E LA PUPILLA: puntano esattamente verso la posizione a schermo del giocatore */
  var playerScreenX=P.x-camx;
  var playerScreenY=(P.y-48)-camy;
  var dx=playerScreenX-ex;
  var dy=playerScreenY-ey;
  var dl=Math.sqrt(dx*dx+dy*dy)||1;
  var maxLookX=64;
  var maxLookY=36;
  var ix=clamp((dx/dl)*68,-maxLookX,maxLookX);
  var iy=clamp((dy/dl)*44,-maxLookY,maxLookY);

  var ig=ctx.createRadialGradient(ix,iy,6,ix,iy,74);
  if(urgent){
    ig.addColorStop(0,"#ffb08a");
    ig.addColorStop(0.55,"#c23a2a");
    ig.addColorStop(1,"#20180e");
  }else if(on){
    ig.addColorStop(0,"#e8c98a");
    ig.addColorStop(0.55,"#8f7036");
    ig.addColorStop(1,"#20180e");
  }else{
    ig.addColorStop(0,"#cfd8dc");
    ig.addColorStop(0.55,"#546e7a");
    ig.addColorStop(1,"#121b20");
  }
  ctx.fillStyle=ig;
  ctx.beginPath();ctx.arc(ix,iy,74,0,6.3);ctx.fill();

  /* Pupilla */
  ctx.fillStyle="#08080a";
  ctx.beginPath();ctx.arc(ix,iy,on?36:28,0,6.3);ctx.fill();

  /* Riflesso luce */
  ctx.fillStyle="rgba(255,255,255,0.85)";
  ctx.beginPath();ctx.arc(ix-18,iy-20,9,0,6.3);ctx.fill();

  /* Contorno e ciglia */
  ctx.strokeStyle="rgba(20,14,10,0.55)";ctx.lineWidth=6;
  ctx.beginPath();ctx.ellipse(0,0,178,112,0,0,6.3);ctx.stroke();

  ctx.restore();

  /* Fascio di luce conico quando urgente */
  if(urgent){
    var ang=Math.atan2(dy,dx);
    ctx.save();
    ctx.translate(ex,ey);
    ctx.rotate(ang-Math.PI/2);
    var bg=ctx.createLinearGradient(0,0,0,VH);
    bg.addColorStop(0,"rgba(255,90,70,"+(0.16+0.18*pulse)+")");
    bg.addColorStop(1,"rgba(255,90,70,0)");
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(-50*EK,50*EK);
    ctx.lineTo(50*EK,50*EK);
    ctx.lineTo(260*EK,VH*1.2);
    ctx.lineTo(-260*EK,VH*1.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function drawDaisyAnim(){
  var k=Math.min(1,G.daisy/2.2);
  var x=P.x-camx,y=P.y-camy;
  var i,a,r,alpha;
  ctx.save();
  if(G.daisy<0.5){
    ctx.globalAlpha=1-G.daisy/0.5;
    ctx.fillStyle="rgba(255,250,235,0.8)";
    ctx.beginPath();ctx.arc(x,y-50,260*G.daisy/0.5+40,0,6.3);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.translate(x,y-50);
  for(i=0;i<12;i++){
    a=i/12*6.283+(1-k)*0.6;
    r=lerp(6,80,k);
    alpha=Math.min(1,k*1.8);
    ctx.save();
    ctx.translate(Math.cos(a)*r*0.85,Math.sin(a)*r*0.6);
    ctx.rotate(a+1.57);
    ctx.globalAlpha=alpha;
    var pg=ctx.createLinearGradient(0,-16,0,16);
    pg.addColorStop(0,"rgba(255,255,252,0.98)");
    pg.addColorStop(1,"rgba(224,222,206,0.62)");
    ctx.fillStyle=pg;
    ctx.beginPath();ctx.ellipse(0,0,lerp(3,11,k),lerp(6,23,k),0,0,6.3);ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=Math.min(1,k*1.5);
  var cg=ctx.createRadialGradient(0,0,2,0,0,26*k+8);
  cg.addColorStop(0,"#ffe9a8");cg.addColorStop(.6,"#e8b44a");cg.addColorStop(1,"#8a6420");
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(0,0,lerp(6,25,k),0,6.3);ctx.fill();
  ctx.fillStyle="#1a1208";
  ctx.beginPath();ctx.arc(0,0,lerp(3,10,k),0,6.3);ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(63,107,82,0.9)";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(0,10);ctx.quadraticCurveTo(6,60,0,112);ctx.stroke();
  ctx.restore();
}

/* ============================================================
   IL GIRO
   ============================================================ */
function update(){
  var i;
  G.msgT=Math.max(0,G.msgT-dt);
  G.shake*=Math.pow(0.02,dt);
  G.flash=Math.max(0,G.flash-dt*1.8);
  if(G.intro>0)G.intro-=dt;
  if(G.daisy>0){
    G.daisy+=dt;
    if(G.daisy>2.9&&!G.ended)G.ended=true;
  }else if(G.win>0){
    G.win+=dt;
    if(G.win>2.2&&!G.ended){
      G.ended=true;
      returnToCosmo();
    }
  }else{
    if(G.eyeCooldown>0 && !G.timeFrozen) G.eyeCooldown = Math.max(0, G.eyeCooldown - dt);
    if(G.timeFrozen){
      G.freezeTimer = Math.max(0, G.freezeTimer - dt);
      if(G.freezeTimer <= 0){
        unfreezeTime();
      }
    }
    updatePlayer();
    if(!P.dead&&(mouse.down||keys["j"]))fire();
    updateBullets();
    if(!G.timeFrozen){
      updateEnemies();
      updateEye();
    }
    updatePickups();
  }
  updateParts();
  for(i=ents.length-1;i>=0;i--){
    if(ents[i].dead&&Math.random()<dt*1.2)ents.splice(i,1);
  }
  updateCam();
}
function draw(){
  ctx.setTransform(scale,0,0,scale,offX,offY);
  ctx.clearRect(0,0,VW,VH);
  drawSky();
  drawSewerBack();
  ctx.save();
  if(G.shake>0.2)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  drawStructures();
  drawPits();
  drawLadders();
  drawExit();
  drawNotes();
  drawCassette();
  drawEnemies();
  drawBullets();
  drawParts();
  if(G.daisy>0)drawDaisyAnim();
  else drawRabbit();
  ctx.restore();
  drawEye();
  if(G.flash>0){
    ctx.fillStyle="rgba(255,200,140,"+(G.flash*0.45)+")";
    ctx.fillRect(0,0,VW,VH);
  }
  drawPsychedelicGlitchPass();
  if(G.timeFrozen){
    ctx.save();
    ctx.fillStyle="rgba(147, 51, 234, 0.09)";
    ctx.fillRect(0, 0, VW, VH);
    ctx.strokeStyle="rgba(192, 132, 252, 0.20)";
    ctx.lineWidth=1.5;
    for(var ri=0; ri<3; ri++){
      var rad = ((time * 90 + ri * 180) % 550);
      ctx.beginPath();
      ctx.arc(P.x - camx, P.y - 48 - camy, rad, 0, 6.28);
      ctx.stroke();
    }
    ctx.restore();
  }
  drawHUD();
  drawOverlays();
}
var last=0;
function frame(ts){
  var now=ts||0;
  dt=last?Math.min(0.034,(now-last)/1000):0.016;
  last=now;
  if(!(dt>0))dt=0.016;
  time+=dt;
  update();
  draw();
  requestAnimationFrame(frame);
}
reset();
draw();
requestAnimationFrame(frame);
