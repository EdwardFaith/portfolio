    <style>

        /* ─── CODICE: i giochi su una linea (computer) o due (tablet 4+3, telefono 2 per riga) ─── */
        .giochi-fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
        .giochi-fila > * { width: calc(50% - 0.5rem); }
        @media (min-width: 640px) { .giochi-fila > * { width: calc(25% - 0.75rem); } }
        @media (min-width: 1024px) { .giochi-fila > * { width: calc((100% - 6rem) / 7); } }

        /* ─── MATERIALI: i 5 cortometraggi su una linea (computer); più stretti, righe centrate ─── */
        .corti-fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
        .corti-fila > * { width: 100%; }
        @media (min-width: 768px) { .corti-fila > * { width: calc(50% - 0.75rem); } }
        @media (min-width: 1024px) { .corti-fila > * { width: calc((100% - 6rem) / 5); } }

        /* ─── CHARLES IN VHS (riquadro «clicca su di me») ─── */
        .vhs { animation: vhsJitter 3.2s steps(1) infinite; }
        .vhs-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 8px; filter: contrast(1.2) saturate(0.7) brightness(0.95); }
        .vhs-r { mix-blend-mode: screen; opacity: .55; filter: sepia(1) saturate(6) hue-rotate(-50deg) brightness(.8); transform: translateX(3px); animation: vhsShiftR 2.6s infinite; }
        .vhs-b { mix-blend-mode: screen; opacity: .5; filter: sepia(1) saturate(6) hue-rotate(170deg) brightness(.8); transform: translateX(-3px); animation: vhsShiftB 2.6s infinite; }
        .vhs-band { position: absolute; left: 0; right: 0; height: 18%; top: -20%; background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 45%, rgba(255,255,255,.05) 55%, transparent); backdrop-filter: blur(1px) saturate(1.6); animation: vhsBand 4.5s linear infinite; }
        .vhs-rec { position: absolute; top: 8px; left: 10px; font-size: 10px; letter-spacing: .15em; color: rgba(255,255,255,.8); text-shadow: 1px 0 rgba(255,0,0,.7), -1px 0 rgba(0,120,255,.7); }
        @keyframes vhsBand { from { top: -20%; } to { top: 110%; } }
        @keyframes vhsShiftR { 0%, 88%, 100% { transform: translateX(3px); } 90% { transform: translateX(9px); } 94% { transform: translateX(-2px); } }
        @keyframes vhsShiftB { 0%, 88%, 100% { transform: translateX(-3px); } 91% { transform: translateX(-8px); } 95% { transform: translateX(2px); } }
        @keyframes vhsJitter { 0%, 100% { transform: none; } 47% { transform: translate(1px, -1px) skewX(-1.5deg); } 48% { transform: translate(-2px, 0) skewX(2deg); } 49% { transform: none; } 81% { transform: translateY(2px); } 82% { transform: none; } }
        @media (prefers-reduced-motion: reduce) { .vhs, .vhs-r, .vhs-b, .vhs-band { animation: none; } }

        /* ─── SUBCONSCIO disintegration ─── */
        @keyframes subcParticleFloat {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }

            30% {
                opacity: 0.9;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) rotate(var(--tr)) scale(var(--ts));
                opacity: 0;
            }
        }

        @keyframes subcBgPulse {
            0% {
                background-color: #050505;
            }

            40% {
                background-color: #0a0005;
            }

            80% {
                background-color: #000000;
            }

            100% {
                background-color: #000000;
            }
        }

        .subc-fragment {
            position: fixed;
            background: #fff;
            z-index: 9998;
            pointer-events: none;
            border-radius: 1px;
            animation: subcParticleFloat var(--dur) ease-in-out forwards;
        }

        /* ---- IL SEGNO DEL SUBCONSCIO -------------------------------
           Un punto interrogativo rosso, grande quanto lo schermo.
           Prima qui c'era un coniglio bianco: il gioco è lo stesso,
           il segno no. */
        .subc-punto-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9997;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .subc-punto-overlay.visible {
            opacity: 1;
        }

        .subc-punto-overlay span {
            font-size: 35vmin;
            font-weight: 700;
            line-height: 1;
            color: #dc2626;
            font-family: Consolas, Inconsolata, cursive;
            text-shadow: 0 0 40px rgba(220, 38, 38, 0.55);
            animation: puntoSpin 1.2s ease-in-out;
            display: inline-block;
        }

        @keyframes puntoSpin {
            0% {
                transform: scale(0.1) rotate(-20deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.08) rotate(5deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ─── LA LUMACA CHE PASSA NELL'HOME ─────────────────────
           Il disegno viene da `lumaca/lumaca.gif`, il file così com'è:
           un GIF animato di 1138×640, 80 fotogrammi da 100 ms, cioè otto
           secondi esatti per un giro, disegno chiaro su fondo nero.
           La lumaca non sta in scena: si aspetta, e ogni quaranta secondi
           fa una passata — compare in fondo alla sezione, il GIF parte
           dal primo fotogramma e arriva in fondo al giro, poi sparisce e
           si torna ad aspettare. I due tempi stanno nello script, dentro
           `HeroLumaca`: `LUMACA_ATTESA` e `LUMACA_GIRO`.
           Trasparenza dentro il GIF non ce n'è — il nero è vernice — e
           non serve fabbricarla in un altro file: si toglie dal CSS.
           `screen` è una fusione che ha il nero come elemento neutro,
           quindi il riquadro sparisce nel fondo e resta solo il segno
           chiaro; l'opacità abbassa quel segno e lo fa stare indietro,
           che è quello che si chiede a una figura di sfondo.
           Il disegno non occupa tutta la tela: sta nella fascia che va
           da (13,264) a (1137,448), cioè 1125×185, con il nero attorno.
           Il riquadro qui sotto è alto quanto la fascia, e l'immagine è
           scalata e spostata in negativo di quei pixel: nei bordi del
           riquadro cade esattamente il disegno. Le misure sono quelle
           vere, misurate sul file: se un giorno cambia il GIF, vanno
           rimisurate. `--passo` è la larghezza su cui si scala il
           disegno, più di uno schermo: se ne vede la parte sinistra, che
           è dove sta la lumaca.
           La figura poggia sul bordo basso della sezione. */
        .hero-lumaca-via {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            pointer-events: none;
            --passo: 160vw;
            /* Il nero del GIF non è trasparenza, è vernice: da solo
               farebbe il riquadro. Con `screen` il nero è l'elemento
               neutro della fusione — sparisce nel fondo e resta solo il
               disegno chiaro. Fuori dalla passata qui dentro non c'è
               niente da fondere: il contenitore resta, il disegno lo
               mette e lo toglie React. */
            mix-blend-mode: screen;
        }

        /* la finestra sul GIF: alta quanto la fascia del disegno, larga il
           passo, e ritagliata — dentro ci sta l'immagine intera, spostata
           in negativo di quei tredici e di quei duecentossessantaquattro
           pixel, così nei bordi cade il disegno e non il nero che avanza.
           Dentro ci va uno `<img>` vero e non uno sfondo CSS: un GIF,
           per ripartire dal primo fotogramma, ha bisogno di un nodo
           nuovo, e la `background-image` la tiene il browser.
           `lumacaPassa` è la passata: entra in mezzo secondo, sta lì per
           tutto il giro, esce negli ultimi mezzo secondo. Così non si
           vede mai il fotogramma zero ripresentarsi dopo il
           ricominciamento del loop. La durata arriva dallo script in
           `--giro`: è la stessa che il timer usa per togliere la scena,
           così CSS e JavaScript non possono andare d'accordo male. */
        .hero-lumaca {
            width: var(--passo);
            height: calc(var(--passo) * 185 / 1125);
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            user-select: none;
        }

        .hero-lumaca.in-scena {
            animation: lumacaPassa var(--giro, 8s) linear forwards;
        }

        .hero-lumaca img {
            display: block;
            width: calc(var(--passo) * 1138 / 1125);
            height: auto;
            margin-left: calc(var(--passo) * -13 / 1125);
            margin-top: calc(var(--passo) * -264 / 1125);
            pointer-events: none;
            user-select: none;
        }

        @keyframes lumacaPassa {
            0% {
                opacity: 0;
            }

            6% {
                opacity: 0.5;
            }

            94% {
                opacity: 0.5;
            }

            100% {
                opacity: 0;
            }
        }

        /* IL NOME, PICCOLO E ROSSO, AL CENTRO DELL'HOME ─────────────
           Come era prima che in mezzo restasse solo la lumaca: una riga
           sola in carattere a macchina, minuscola, rossa, in maiuscoletto
           spaziato, nel mezzo della sezione e sopra lo slideshow. Prende

           text-xs md:text-sm`, uppercase, tracking 0.3em). Non prende i
           clic: ci passa attraverso, e il clic va alla sezione che
           scorre giù. L'ombra sotto al testo serve solo a staccarlo dal
           video. */
        .hero-nome {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            margin: 0;
            padding: 0;
            font-family: Consolas, Inconsolata, cursive;
            font-size: clamp(0.75rem, 1.6vw, 0.875rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            color: #dc2626;
            text-shadow: 0 0 18px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            user-select: none;
        }

        /* il ◉ della radio resta, ma senza la riga col nome del pezzo
           che gli sta sotto: nell'home non serve a nessuno, e faceva
           solo rumore sopra il disegno. Il nome ce l'ha il fumetto del

        #radioHud #radioName {
            display: none;
        }
    </style>
</head>

<body>
    <div class="noise-bg"></div>
    <div id="root"></div>

    <!-- la radio del sito: la fila delle canzoni e lo stato che il museo
         tiene in `museo.radio`. Vanno prima del codice React: la fila
         serve anche alla sezione «Canzoni & Audio», che così ha una lista
         sola — e la stessa che suona nel museo. La radio si accende e si
         comanda là (il ◉ dell'HUD, il tasto R, il pinguino del bar); qui
         si ritrova accesa, allo stesso secondo, senza un secondo lettore -->
    <script src="museo/radio-fila.js?v=1"></script>
    <script src="museo/radio.js?v=5"></script>
    <!-- il ◉ della radio accanto al titolo delle canzoni, non più in
         alto a destra: `data-ancora` dice allo script dove montarlo
         (il segnaposto `#radioPosto` nella riga di «Canzoni & Audio»).
         Se il segnaposto non c'è, torna nell'angolo come prima. Il
         tasto R fa lo stesso, tranne quando si sta scrivendo in un
         campo -->
    <script src="museo/radio-schermo.js?v=4" data-tasto="r" data-ancora="#radioPosto"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ── Subconscio disintegration ──────────────────────────────
        // Se si torna indietro dal Subconscio (cache del browser), la pagina
        // ricompare com'era a metà effetto: invisibile e con il segno sopra.
        // Qui la si rimette a posto.
        function restoreFromSubconscious() {
            document.querySelectorAll('.subc-punto-overlay, .subc-fragment').forEach(el => el.remove());
            const root = document.getElementById('root');
            if (root) { root.style.filter = ''; root.style.opacity = '1'; }
        }
        window.addEventListener('pageshow', restoreFromSubconscious);

        function triggerSubconsciousEffect(callback) {
            // Phase 1: fragment the page
            const body = document.body;
            const W = window.innerWidth, H = window.innerHeight;
            const FRAGS = 180;

            // Create white pixel fragments
            for (let i = 0; i < FRAGS; i++) {
                const el = document.createElement('div');
                el.className = 'subc-fragment';
                const x0 = Math.random() * W;
                const y0 = Math.random() * H;
                const size = 2 + Math.random() * 6;
                el.style.cssText = `
                    left: ${x0}px; top: ${y0}px;
                    width: ${size}px; height: ${size}px;
                    --tx: ${(Math.random() - 0.5) * W * 0.8}px;
                    --ty: ${(Math.random() - 0.5) * H * 0.8}px;
                    --tr: ${(Math.random() - 0.5) * 720}deg;
                    --ts: ${0.1 + Math.random() * 0.5};
                    --dur: ${0.6 + Math.random() * 1.0}s;
                    animation-delay: ${Math.random() * 0.3}s;
                `;
                body.appendChild(el);
                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1500);
            }

            // Glitch the root element
            const root = document.getElementById('root');
            if (root) {
                root.style.transition = 'filter 0.3s, opacity 0.5s';
                root.style.filter = 'invert(1) hue-rotate(180deg) blur(2px)';
                root.style.opacity = '0';
            }

            // After animation → navigate
            setTimeout(() => {
                if (callback) callback();
                setTimeout(() => {
                    if (root) { root.style.filter = ''; root.style.opacity = '1'; }
                }, 400);
            }, 900);
        }

        // Icons components
        const Icons = {
            Home: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>,

                const goOffline = () => setIsOffline(true);

                window.addEventListener('offline', goOffline);

                return () => {

                };

            /* INTERNET BUONO → VIDEO, INTERNET SCARSO → RESTA LA GIF
               Prima si chiede al browser com'è la connessione (Chrome e
               Android lo sanno dire); se non lo sa, si misura quanto ci ha
               messo la GIF di sfondo a scaricarsi: nessun download in più.
               Finché non si sa, i video aspettano. */
            const [netOk, setNetOk] = useState(() => {
                const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!c) return null;
                if (c.saveData) return false;
                if (c.effectiveType && /(^|-)(2g|3g)$/.test(c.effectiveType)) return false;
                if (typeof c.downlink === 'number' && c.downlink > 0 && c.downlink < 2) return false;
                return c.effectiveType ? true : null;
            });
            const misuraDallaGif = (e) => {
                if (netOk !== null) return;
                const url = e && e.currentTarget && e.currentTarget.currentSrc;
                const entry = performance.getEntriesByType('resource').reverse().find(r => url && r.name === url);
                if (!entry || !entry.duration) { setNetOk(true); return; }
                if (entry.transferSize > 0) {
                    const mbps = entry.transferSize * 8 / entry.duration / 1000;   // megabit al secondo
                    setNetOk(mbps >= 2.5);
                } else {
                    setNetOk(entry.duration < 2500);   // dalla cache o senza misura: basta il tempo
                }
            };
            useEffect(() => {
                const c = navigator.connection;
                if (!c || !c.addEventListener) return;
                // se la connessione peggiora mentre si guarda il sito, i video si fermano
                const onChange = () => { if (c.saveData || /(^|-)(2g|3g)$/.test(c.effectiveType || '')) setNetOk(false); };
                c.addEventListener('change', onChange);
                return () => c.removeEventListener('change', onChange);
            }, []);

            // Defer YouTube embeds slightly so page loads instantly for Google & users
            useEffect(() => {
                const timer = setTimeout(() => setStarted(true), 1800);
                const onFirstInteraction = () => {
                    setStarted(true);
                    cleanup();
                };
                const cleanup = () => {
                    window.removeEventListener('scroll', onFirstInteraction);
                    window.removeEventListener('touchstart', onFirstInteraction);
                    window.removeEventListener('mousemove', onFirstInteraction);
                };
                window.addEventListener('scroll', onFirstInteraction, { passive: true, once: true });
                window.addEventListener('touchstart', onFirstInteraction, { passive: true, once: true });
                window.addEventListener('mousemove', onFirstInteraction, { passive: true, once: true });
                return () => {
                    clearTimeout(timer);
                    cleanup();
                };
            }, []);

            const handleLoadA = () => {
                clearTimeout(readyTimers.current.A);
                readyTimers.current.A = setTimeout(() => setReadyA(true), 3500);
            };
            const handleLoadB = () => {
                clearTimeout(readyTimers.current.B);
                readyTimers.current.B = setTimeout(() => setReadyB(true), 3500);
            };

            useEffect(() => { setReadyA(false); }, [slotA]);
            useEffect(() => { setReadyB(false); }, [slotB]);

            useEffect(() => {
                if (!started) return;
                const interval = setInterval(() => {
                    setFading(true);
                    setTimeout(() => {
                        setActiveSlot(prev => {
                            if (prev === 'A') {
                                setSlotA(s => (s + 2) % HERO_VIDEOS.length);
                                return 'B';
                            } else {
                                setSlotB(s => (s + 2) % HERO_VIDEOS.length);
                                return 'A';
                            }
                        });
                        setFading(false);
                    }, 800);
                }, 10000);
                return () => clearInterval(interval);
            }, [started]);

            const embedUrl = (id) =>
                `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0&loop=1&playlist=${id}&disablekb=1&iv_load_policy=3`;

            const iframeOpacity = (isActive, isReady) => {
                if (isOffline || !netOk || !isReady || !isActive || !started) return 0;
                return fading ? 0 : 0.55;
            };

            const videoVisible = started && netOk && !fading && (
                (activeSlot === 'A' && readyA) ||
                (activeSlot === 'B' && readyB)
            );

            const iframeStyle = (isActive, isReady) => ({
                position: 'absolute',
                inset: 0,
                width: '100%',
                height: '100%',
                border: 'none',
                transform: 'scale(1.18)',
                opacity: iframeOpacity(isActive, isReady),
                transition: 'opacity 1.2s ease-in-out',
                filter: 'grayscale(1) contrast(1.15) brightness(0.8)',
                pointerEvents: 'none',
                zIndex: 2,

            return (
                <div className="absolute inset-0 z-0 overflow-hidden pointer-events-none">

                        src="giff-presentazione/bg.gif"

                        style={{
                            zIndex: 1,
                            opacity: videoVisible ? 0 : 0.5,
                            transition: 'opacity 1.2s ease-in-out',
                        }}
                    />

                    {/* Layer 2: YouTube iframes - Lazy loaded */}
                    {started && netOk && (
                        <iframe
                            key={`A-${slotA}`}
                            src={embedUrl(HERO_VIDEOS[slotA])}
                            allow="autoplay; encrypted-media"
                            allowFullScreen={false}
                            tabIndex={-1}
                            onLoad={handleLoadA}
                            style={iframeStyle(activeSlot === 'A', readyA)}
                            title="bg-a"
                        />
                    )}
                    {started && netOk && (activeSlot === 'B' || fading) && (
                        <iframe
                            key={`B-${slotB}`}
                            src={embedUrl(HERO_VIDEOS[slotB])}
                            allow="autoplay; encrypted-media"
                            allowFullScreen={false}
                            tabIndex={-1}
                            onLoad={handleLoadB}
                            style={iframeStyle(activeSlot === 'B', readyB)}
                            title="bg-b"
                        />
                    )}

                    {/* Layer 3: top-bottom gradient */}
                    <div
                        className="absolute inset-0 bg-gradient-to-b from-black via-transparent to-black"
                        style={{ zIndex: 4, pointerEvents: 'none' }}
                    />

           Prototipo: le lettere del nome non hanno tutte la stessa
           faccia. La parola si legge lo stesso perché lo scheletro è
           lo stesso (maiuscole, stessa altezza, stessa spaziatura), ma

           macchina da scrivere. Vale per i titoli e per l'interfaccia;
           le descrizioni restano in un carattere solo — un testo lungo
           misto non si legge, un titolo misto sì. */
        /* ora un carattere solo, come tutto il sito: Consolas */
        const MIX_FONTS = [
            "var(--titoli)"
        ];

        const TitleMix = ({ text, className = "" }) => {
            const lettere = String(text || "").split("");
            return (
                <span className={className}>
                    {lettere.map((ch, i) => (
                        ch === " " ? <span key={i}> </span> : (
                            <span
                                key={i}
                                style={{
                                    fontFamily: MIX_FONTS[(i * 5 + lettere.length) % MIX_FONTS.length],
                                    fontWeight: i % 3 === 0 ? 700 : 400,
                                    fontStyle: i % 7 === 3 ? "italic" : "normal",
                                    letterSpacing: i % 2 ? "0.01em" : "-0.02em",

        /* ── LA LUMACA CHE PASSA ────────────────────────────────────
           Un GIF, quando arriva in fondo al giro, ricomincia: non si
           ferma, e dal CSS non lo si riavvia. Per avere una passata ogni
           tanto, quindi, non basta nasconderlo e mostrarlo — alla
           quarantesima passata la lumaca sarebbe a metà del giro. Si
           ricostruisce il nodo: la `key` è il numero della passata, React
           toglie il vecchio `<img>` e ne mette uno nuovo, e il browser
           ricomincia dal primo fotogramma. In più, appena il nodo esiste,
           il `src` si toglie e si rimette: è il trucco che fa ripartire
           il GIF anche quando il browser tiene l'immagine in cache (e ce
           l'ha, perché il GIF si scalda appena la pagina si apre, non
           alla prima passata).
           I tempi: `LUMACA_GIRO` è la durata del GIF — ottanta fotogrammi
           da un decimo di secondo, otto secondi — e la stessa che passa
           al CSS in `--giro` per l'animazione; `LUMACA_ATTESA` è ogni
           quanto si riparte, quaranta secondi. La prima passata arriva
           dopo la prima attesa, non subito.

           della scena, entrambi azzerati quando il componente se ne va:
           niente timer orfani che continuano a lavorare per una pagina
           che non c'è più. */
        const LUMACA_GIF = "lumaca/lumaca.gif";
        const LUMACA_GIRO = 8000;      // il GIF: 80 fotogrammi da 100 ms
        const LUMACA_ATTESA = 40000;   // una passata ogni quaranta secondi

        const HeroLumaca = () => {
            const [passata, setPassata] = useState(0);   // 0 = in attesa
            const imgRef = useRef(null);

                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                let fine;
                const ogni = setInterval(() => {
                    setPassata(p => p + 1);      // nodo nuovo: si riparte da zero
                    clearTimeout(fine);
                    fine = setTimeout(() => setPassata(0), LUMACA_GIRO);
                }, LUMACA_ATTESA);
                return () => {
                    clearInterval(ogni);
                    clearTimeout(fine);
                };
            }, []);

            useEffect(() => {
                const img = imgRef.current;
                if (!img) return;
                // togliere e rimettere il `src` è il modo per far
                // ripartire un GIF anche quando è già in cache
                img.removeAttribute("src");
                img.setAttribute("src", LUMACA_GIF);
            }, [passata]);

            return (
                <div className="hero-lumaca-via" aria-hidden="true">
                    {passata > 0 && (
                        <div
                            key={passata}
                            className="hero-lumaca in-scena"
                            style={{ "--giro": LUMACA_GIRO + "ms" }}
                        >
                            <img ref={imgRef} src={LUMACA_GIF} alt="" />
                        </div>
                    )}
                </div>
            );

            const minSwipeDistance = 50;
            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            }
            const onTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);
            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;
                if (isLeftSwipe) handleNext();
                if (isRightSwipe) handlePrev();
            }

            // Keyboard navigation
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!selectedImage) return;
                    if (e.key === 'ArrowLeft') handlePrev(e);
                    if (e.key === 'ArrowRight') handleNext(e);
                    if (e.key === 'Escape') closeLightbox();
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedImage]);

            const openLightbox = (item) => {

                { title: "Mortem", url: "RadioKaoSs/canzoni/mortem.MP3" },
                { title: "Non voglio", url: "RadioKaoSs/canzoni/non voglio.mpeg" },
                { title: "Oggi non resto", url: "RadioKaoSs/canzoni/oggi non resto.mp3" },
                { title: "Passami la cartapesta", url: "RadioKaoSs/canzoni/passami la cartapesta.mp3" },
                { title: "Per un tempo futuro", url: "RadioKaoSs/canzoni/per un tempo futuro.mpeg" },
                { title: "Sarà", url: "RadioKaoSs/canzoni/sarà.mp3" },
                { title: "Satan", url: "RadioKaoSs/canzoni/satan.MP3" },
                { title: "Sei sicura", url: "RadioKaoSs/canzoni/sei sicura.MP3" }
            ];

        /* ---- la fila: solo canzoni ----------------------------------
           Gli spot non stanno più qui. La fila è quella che è: le
           canzoni, nell'ordine in cui sono state scritte, senza
           pubblicità in mezzo. */
        const radioSlots = audioFiles;

        /* ---- una radio sola, in fila --------------------------------
           Le canzoni non sono venti lettori indipendenti: sono una
           scaletta, e la scaletta la tiene questo registro — così una
           che finisce sa chi è la prossima. Play e pausa non ricaricano
           niente: `src` non si tocca mai, `currentTime` nemmeno. Il
           pezzo resta fermo dov'è e riparte da quel secondo. */
        const radioRow = { cards: [], playing: -1 };

        const AudioTrack = ({ title, url, index }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [showPlayer, setShowPlayer] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const audioRef = React.useRef(null);
            const progressRef = React.useRef(null);

            /* far suonare questa: la radio è una sola, quindi le altre
               si mettono in pausa — ferme dov'erano, non azzerate */
            const play = React.useCallback(() => {
                const a = audioRef.current;
                if (!a) return;
                /* e se in basso a sinistra sta suonando la stazione, si
                   spegne lei: due musiche insieme non sono un mix */
                if (window.MUSEO && MUSEO.RADIO && (MUSEO.RADIO.on || MUSEO.RADIO.armato)) {
                    MUSEO.RADIO.stop();
                }
                radioRow.cards.forEach((c, i) => {
                    if (i !== index && c && c.pausa) c.pausa();
                });
                radioRow.playing = index;
                const p = a.play();
                if (p && p.catch) p.catch(() => { /* niente gesto: resta ferma */ });
            }, [index]);

            const togglePlay = () => {
                if (!audioRef.current) return;
                if (!showPlayer) {
                    setShowPlayer(true);
                    play();
                } else if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    play(); /* riprende da dove era: nessun ricaricamento */
                }
            };

            const handleStop = (e) => {
                e.stopPropagation();
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                    setIsPlaying(false);
                    setShowPlayer(false);
                    setCurrentTime(0);
                    radioRow.playing = -1;
                }
            };

            const formatTime = (time) => {
                if (isNaN(time)) return "0:00";
                const mins = Math.floor(time / 60);
                const secs = Math.floor(time % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            const handleSeek = (e) => {
                e.stopPropagation();
                if (!audioRef.current || !progressRef.current) return;
                const rect = progressRef.current.getBoundingClientRect();
                const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : (e.clientX || 0);
                const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                audioRef.current.currentTime = pos * audioRef.current.duration;
            };

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const onPlay = () => setIsPlaying(true);
                const onPause = () => setIsPlaying(false);
                const onEnded = () => {
                    setIsPlaying(false);
                    /* finita: parte la successiva della fila. Dopo
                       l'ultima si torna alla prima, e il giro non si
                       ferma finché qualcuno non lo ferma */
                    const next = radioRow.cards[(index + 1) % radioSlots.length];
                    if (next && next.play) next.play();
                };
                const onTimeUpdate = () => setCurrentTime(audio.currentTime);
                const onLoadedMetadata = () => setDuration(audio.duration);

                audio.addEventListener('play', onPlay);
                audio.addEventListener('pause', onPause);
                audio.addEventListener('ended', onEnded);
                audio.addEventListener('timeupdate', onTimeUpdate);
                audio.addEventListener('loadedmetadata', onLoadedMetadata);

                if (audio.readyState > 0) {
                    setDuration(audio.duration);
                }

                return () => {
                    audio.removeEventListener('play', onPlay);
                    audio.removeEventListener('pause', onPause);
                    audio.removeEventListener('ended', onEnded);
                    audio.removeEventListener('timeupdate', onTimeUpdate);
                    audio.removeEventListener('loadedmetadata', onLoadedMetadata);
                };
            }, []);

            /* il posto in fila: chi arriva in fondo chiama il prossimo
               di qui, anche se il suo lettore è un altro */
            useEffect(() => {
                radioRow.cards[index] = {
                    play: () => { setShowPlayer(true); play(); },
                    pausa: () => {
                        const a = audioRef.current;
                        if (a && !a.paused) a.pause();
                    }
                };
                return () => {
                    radioRow.cards[index] = null;
                    if (radioRow.playing === index) radioRow.playing = -1;
                };
            }, [index, play]);

            return (
                <div
                    className="flex flex-col bg-black border border-neutral-800 hover:border-white transition-colors cursor-pointer group p-4"
                    onClick={!showPlayer ? togglePlay : undefined}
                >
                    <div className="flex items-center gap-4">
                        <button
                            onClick={(e) => { e.stopPropagation(); togglePlay(); }}
                            className="w-10 h-10 shrink-0 bg-neutral-900 flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-colors rounded-full"
                        >
                            {isPlaying ? <Icons.Pause className="w-4 h-4 fill-current" /> : <Icons.Play className="w-4 h-4 fill-current" />}
                        </button>
                        <div className="flex-1 min-w-0">
                            <h4 className="text-white font-bold text-sm truncate" title={title}>{title}</h4>
                            <p className="text-xs truncate text-neutral-500">
                                Audio Track
                            </p>
                        </div>
                        {showPlayer && (
                            <button
                                onClick={handleStop}
                                title="Stop"
                                className="w-8 h-8 shrink-0 bg-neutral-900 flex items-center justify-center text-neutral-400 hover:bg-neutral-800 hover:text-white transition-colors rounded-full"
                            >
                                <Icons.Square className="w-3 h-3 fill-current" />
                            </button>
                        )}
                    </div>

                    {showPlayer && (
                        <div className="mt-4 pt-4 border-t border-neutral-800 flex flex-col gap-2" onClick={(e) => e.stopPropagation()}>
                            <div className="flex items-center justify-between text-[10px] font-mono text-neutral-500 px-1">
                                <span>{formatTime(currentTime)}</span>
                                <span>{formatTime(duration)}</span>
                            </div>
                            <div
                                ref={progressRef}
                                className="w-full py-3 -my-2 flex items-center cursor-pointer select-none touch-none"
                                onClick={handleSeek}
                                onTouchMove={handleSeek}
                            >
                                <div className="w-full h-2 bg-neutral-900 rounded-full overflow-hidden relative">
                                    <div
                                        className="absolute top-0 left-0 h-full bg-red-600 pointer-events-none"
                                        style={{ width: `${(currentTime / (duration || 1)) * 100}%` }}
                                    ></div>
                                </div>
                            </div>
                        </div>
                    )}
                    <audio ref={audioRef} src={url} preload="none" className="hidden" />
                </div>
            );
        };

        const MaterialsSection = () => (

                    {/* Canzoni */}
                    <div>
                        <h3 className="text-xl text-white font-bold mb-3 flex items-center gap-3 border-b border-white/10 pb-4">

        const App = () => {
            const [activeSection, setActiveSection] = useState('home');

            useEffect(() => {
                const handleScroll = () => {
                    const sections = ['home', 'kaoss', 'cosmo', 'visual-ai', 'interattivo', 'illustrations', 'materials', 'portfolio', 'bio', 'contact'];

                    // Controllo immediato fondo pagina (Contatti)
                    const isBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100;
                    if (isBottom) {
                        setActiveSection('contact');
                        return;
                    }

                    let current = 'home';
                    sections.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            const rect = el.getBoundingClientRect();
                            // Se la cima della sezione ha superato la parte alta del viewport (con margine)
                            if (rect.top <= 150) {
                                current = id;
                            }
                        }
                    });
                    setActiveSection(current);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    window.scrollTo({
                        top: element.offsetTop,
                        behavior: 'smooth'
                    });
                    setActiveSection(id);
                }
            };

            /* all'avvio si sta in home. Il browser, tornando sulla
               pagina, riporta da solo dove eravamo — e spesso quel
               punto è il Codice: qui la memoria del browser si spegne
               e si riparte dalla cima. L'ancora vale solo quando si
               arriva davvero da un'altra pagina (l'uscita dal museo
               scrive #interattivo, #kaoss...): una ricarica no. */
            useEffect(() => {
                if ("scrollRestoration" in window.history) {
                    window.history.scrollRestoration = "manual";
                }
                const nav = performance.getEntriesByType
                    ? performance.getEntriesByType("navigation")[0]
                    : null;
                const ricarica = !!nav && nav.type === "reload";
                if (ricarica && window.history.replaceState) {
                    window.history.replaceState(null, "", window.location.pathname + window.location.search);
                }
                const id = ricarica ? "" : (window.location.hash || "").replace(/^#/, "");
                const cima = () => {
                    const html = document.documentElement;
                    const prima = html.style.scrollBehavior;
                    html.style.scrollBehavior = "auto";
                    window.scrollTo(0, 0);
                    html.style.scrollBehavior = prima;
                };
                if (!id) {
                    const raf0 = window.requestAnimationFrame(cima);
                    return () => window.cancelAnimationFrame(raf0);
                }
                let tentativi = 0;
                let raf = 0;
                const vai = () => {
                    const el = document.getElementById(id);
                    if (el) {
                        window.scrollTo({ top: el.offsetTop, behavior: "auto" });
                        setActiveSection(id);
                        return;
                    }
                    if (tentativi++ < 300) raf = window.requestAnimationFrame(vai);
                    else cima();
                };
                vai();
                return () => window.cancelAnimationFrame(raf);
            }, []);

            return (
                <div className="min-h-screen bg-black text-white selection:bg-red-900 selection:text-white pb-20 lg:pb-0">
                    <MobileBottomNav scrollToSection={scrollToSection} activeSection={activeSection} />

                    <VisualAISection />

                    <InterattivoSection />
                    <IllustrationsSection />
                    <MaterialsSection />
                    <PortfolioSection />
                    <BioSection />
                    <Footer />
                </div>
            );
        };
