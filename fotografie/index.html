    <style>
        :root {
            --bg-color: #050507;
            --border-color: #121217;
            --accent-teal: #065f46;
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace;
        }

        .font-serif-editorial {
            font-family: 'Cinzel', serif;
        }

        /* Subtle technical dot background pattern instead of heavy grid */
        .tech-dots-bg {
            background-image: radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Glitch keyframe for transaction transition */
        @keyframes glitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-2px, 1px); filter: hue-rotate(45deg); }
            40% { transform: translate(2px, -1px); filter: hue-rotate(90deg); }
            60% { transform: translate(-1px, -1px); filter: hue-rotate(135deg); }
            80% { transform: translate(1px, 1px); filter: hue-rotate(180deg); }
            100% { transform: translate(0); filter: none; }
        }

        .transaction-glitch {
            animation: glitch 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #050507;
        }
        ::-webkit-scrollbar-thumb {
            background: #1c1c24;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-teal);
        }

        /* Hide native cursor when hand tracking is active */
        .hand-active,
        .hand-active * {
            cursor: none !important;
        }
    </style>
</head>

        // Synthesizer generating fire crackling sound
        class FireCrackler {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.isPlaying = false;
                this.intervalId = null;
                this.isMuted = false; // default unmuted
                this.noiseBuffer = null;
            }

            init() {
                if (this.ctx) return;
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return;
                    this.ctx = new AudioContextClass();

                    // Master gain node
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(0, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);

                    // Low-frequency rumble (subtle fire warmth/combustion)
                    this.rumbleOsc = this.ctx.createOscillator();
                    this.rumbleOsc.type = 'sine';
                    this.rumbleOsc.frequency.setValueAtTime(55, this.ctx.currentTime);

                    const rumbleFilter = this.ctx.createBiquadFilter();
                    rumbleFilter.type = 'lowpass';
                    rumbleFilter.frequency.setValueAtTime(70, this.ctx.currentTime);

                    this.rumbleGain = this.ctx.createGain();
                    this.rumbleGain.gain.setValueAtTime(0.08, this.ctx.currentTime);

                    // Modulator LFO for low-end movement
                    this.rumbleLFO = this.ctx.createOscillator();
                    this.rumbleLFO.frequency.setValueAtTime(2.0, this.ctx.currentTime);
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.setValueAtTime(0.03, this.ctx.currentTime);
                    this.rumbleLFO.connect(lfoGain);
                    lfoGain.connect(this.rumbleGain.gain);

                    this.rumbleOsc.connect(rumbleFilter);
                    rumbleFilter.connect(this.rumbleGain);
                    this.rumbleGain.connect(this.masterGain);

                    this.rumbleOsc.start(0);
                    this.rumbleLFO.start(0);

                    // Pre-generate short noise buffer for embers pops
                    const bufferSize = 0.05 * this.ctx.sampleRate; // 50ms buffer
                    this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const channelData = this.noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        channelData[i] = Math.random() * 2 - 1;
                    }
                } catch (err) {
                    console.warn("Web Audio API not supported or blocked", err);
                }
            }

            playPop() {
                if (!this.ctx || this.ctx.state === 'suspended' || this.isMuted) return;
                try {
                    const source = this.ctx.createBufferSource();
                    source.buffer = this.noiseBuffer;

                    // Highpass filter for crackling sound
                    const hpFilter = this.ctx.createBiquadFilter();
                    hpFilter.type = 'highpass';
                    hpFilter.frequency.setValueAtTime(1800 + Math.random() * 1000, this.ctx.currentTime);

                    // Quick decay gain envelope
                    const popGain = this.ctx.createGain();
                    const duration = 0.003 + Math.random() * 0.012; // 3ms to 15ms
                    const volume = 0.010 + Math.random() * 0.025;

                    popGain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    popGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    source.connect(hpFilter);
                    hpFilter.connect(popGain);
                    popGain.connect(this.masterGain);

                    source.start(0);
                    source.stop(this.ctx.currentTime + duration + 0.01);
                } catch (err) {
                    // Silently fail
                }
            }

            start() {
                if (this.isMuted) return;
                if (!this.ctx) this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(e => console.warn(e));
                }

                // Smoothly fade in fire sound
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, this.ctx.currentTime);
                    this.masterGain.gain.linearRampToValueAtTime(0.30, this.ctx.currentTime + 0.2);
                }

                // Crackles scheduling loop
                if (this.intervalId) clearTimeout(this.intervalId);
                this.isPlaying = true;
                const schedule = () => {
                    if (!this.isPlaying) return;
                    const delay = 45 + Math.random() * 150;
                    this.intervalId = setTimeout(() => {
                        this.playPop();
                        if (Math.random() < 0.20) {
                            setTimeout(() => this.playPop(), 10 + Math.random() * 20);
                        }
                        if (this.isPlaying) schedule();
                    }, delay);
                };
                schedule();
            }

            stop() {
                this.isPlaying = false;
                if (this.intervalId) {
                    clearTimeout(this.intervalId);
                    this.intervalId = null;
                }
                if (this.masterGain && this.ctx) {
                    try {
                        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, this.ctx.currentTime);
                        this.masterGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.2);
                    } catch (err) {
                        // Ignore
                    }
                }
            }

            setMute(mute) {
                this.isMuted = mute;
                if (mute) this.stop();
                else this.start();
            }
        }

        const fireSound = new FireCrackler();

        // ──────────────────────────────────────────────────────────────────
        // HAND CURSOR — SVG overlay that follows the index finger tip
        // Shows a teal ring that fills up during dwell (0 → 1 = 0.75s)
        // ──────────────────────────────────────────────────────────────────
        function HandCursor({ pos, progress, isOnHoldButton }) {
            if (!pos) return null;
            const R = 20;
            const circumference = 2 * Math.PI * R;
            const strokeDash = circumference * Math.min(progress, 1);
            const color = isOnHoldButton ? '#065f46' : '#ef4444'; // red default, green on hold btn
            return (
                <div style={{
                    position: 'fixed',
                    left: pos.x,
                    top: pos.y,
                    transform: 'translate(-50%, -50%)',
                    zIndex: 10000,
                    pointerEvents: 'none',
                    transition: 'left 0.04s linear, top 0.04s linear',
                }}>
                    <svg width={54} height={54} style={{ overflow: 'visible', display: 'block' }}>
                        {/* Background ring */}
                        <circle cx={27} cy={27} r={R} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={2.5} />
                        {/* Progress fill ring */}
                        <circle
                            cx={27} cy={27} r={R}
                            fill="none"
                            stroke={color}
                            strokeWidth={3}
                            strokeLinecap="round"
                            strokeDasharray={`${strokeDash} ${circumference}`}
                            transform="rotate(-90 27 27)"
                            style={{ transition: 'stroke-dasharray 0.05s linear' }}
                        />
                        {/* Inner dot */}
                        <circle cx={27} cy={27} r={4} fill={color} opacity={0.95} />
                        {/* Outer white ring */}
                        <circle cx={27} cy={27} r={7} fill="none" stroke="rgba(255,255,255,0.5)" strokeWidth={1} />
                    </svg>
                </div>
            );
        }


        function SandpayCatalog() {
            const [activeScene, setActiveScene] = useState(SCENES_DATA[0]);
            const [isViewerOpen, setIsViewerOpen] = useState(false);
            const [isHolding, setIsHolding] = useState(false);
            const [isOverButton, setIsOverButton] = useState(false);
            const [isGlitching, setIsGlitching] = useState(false);
            const [showConcept, setShowConcept] = useState(false);
            const [unlockedLots, setUnlockedLots] = useState([]);
            const [unlockedViewMode, setUnlockedViewMode] = useState('dream');

            // ── Hand Tracking State ──
            const [handEnabled, setHandEnabled] = useState(false);
            const [fingerPos, setFingerPos] = useState(null);    // {x, y} screen coords
            const [dwellProgress, setDwellProgress] = useState(0); // 0..1
            const [isOnHoldBtn, setIsOnHoldBtn] = useState(false);

            const buttonRef = useRef(null);
            const animationRef = useRef(null);
            const velRef = useRef({ x: 0, y: 0 });
            const posRef = useRef({ x: 0, y: 0 });
            const mouseRef = useRef({ x: 0, y: 0 });
            const wasOverRef = useRef(false);

            // ── Hand Tracking Refs ──
            const videoRef = useRef(null);
            const handsRef = useRef(null);
            const cameraRef = useRef(null);
            const dwellStartRef = useRef(null);
            const dwellElementRef = useRef(null);
            const isHoldingRef = useRef(false);   // mirror of isHolding for closures
            const handEnabledRef = useRef(false);
            const fingerPosRef = useRef(null);

            // State machine refs for evasive button gameplay
            const buttonStateRef = useRef('still'); // 'still', 'flickering', 'chase'
            const holdStartTimeRef = useRef(0);
            const lastFrameTimeRef = useRef(0);
            const currentSpeedRef = useRef(0.3); // starts extremely slow
            const successfulHoldTimeRef = useRef(0);

            // Launch immersive viewer on user interaction
            const handleOpenDream = (scene) => {
                setActiveScene(scene);
                setIsViewerOpen(true);
            };

            const handleCloseDream = () => {
                setIsViewerOpen(false);
                handleStopHolding();
                setUnlockedViewMode('dream');
            };

            const handleStartHolding = (e) => {
                if (e) e.preventDefault();
                setIsHolding(true);
                setIsOverButton(true);
                wasOverRef.current = true;
                setIsGlitching(true);

                // Start fire crackling sound on hold
                fireSound.setMute(false);
                fireSound.start();

                // Set initial mouse reference from click/touch coordinates
                if (e) {
                    const clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY);
                    if (clientX !== undefined && clientY !== undefined) {
                        mouseRef.current = { x: clientX, y: clientY };
                    } else if (buttonRef.current) {
                        const rect = buttonRef.current.getBoundingClientRect();
                        mouseRef.current = {
                            x: rect.left + rect.width / 2,
                            y: rect.top + rect.height / 2
                        };
                    }
                }

                // Initialize the game loop states using high-precision timestamps
                buttonStateRef.current = 'still';
                holdStartTimeRef.current = performance.now();
                lastFrameTimeRef.current = performance.now();
                currentSpeedRef.current = 0.3; // very slow initial crawl
                successfulHoldTimeRef.current = 0;
                velRef.current = { x: 0, y: 0 };
                posRef.current = { x: 0, y: 0 };

                setTimeout(() => setIsGlitching(false), 150);
            };

            const handleStopHolding = () => {
                setIsHolding(false);
                setIsOverButton(false);
                wasOverRef.current = false;
                setIsGlitching(true);
                fireSound.stop();
                setTimeout(() => setIsGlitching(false), 120);
            };

            // Start fleeing animation loop
            const startFleeing = () => {
                posRef.current = { x: 0, y: 0 };

                const updatePosition = () => {
                    if (!buttonRef.current) {
                        animationRef.current = requestAnimationFrame(updatePosition);
                        return;
                    }

                    const now = performance.now();
                    const elapsed = now - holdStartTimeRef.current;
                    const frameTime = now - lastFrameTimeRef.current;
                    const dt = Math.min(frameTime / 16.666, 3.0); // normalize dt to 60fps
                    lastFrameTimeRef.current = now;

                    let vx = velRef.current.x;
                    let vy = velRef.current.y;
                    let px = posRef.current.x;
                    let py = posRef.current.y;

                    // Get button coordinates and center
                    const rect = buttonRef.current.getBoundingClientRect();
                    const bx = rect.left + rect.width / 2;
                    const by = rect.top + rect.height / 2;

                    const mx = mouseRef.current.x;
                    const my = mouseRef.current.y;

                    const dx = bx - mx;
                    const dy = by - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const isOver = mx >= rect.left && mx <= rect.right && my >= rect.top && my <= rect.bottom;

                    // State machine logic: Still (2s) -> Flickering (0.5s) -> Chase (Accelerating)
                    if (elapsed < 2000) {
                        buttonStateRef.current = 'still';
                        vx = 0;
                        vy = 0;
                    } else if (elapsed < 2500) {
                        buttonStateRef.current = 'flickering';
                        vx = 0;
                        vy = 0;

                        // Physical shake in place
                        const shakeX = (Math.random() - 0.5) * 6;
                        const shakeY = (Math.random() - 0.5) * 6;
                        buttonRef.current.style.transform = `translate(${shakeX}px, ${shakeY}px)`;

                        // Rapid border/text color flickering
                        if (Math.random() < 0.3) {
                            buttonRef.current.style.borderColor = '#ef4444'; // Red
                            buttonRef.current.style.color = '#ef4444';
                            buttonRef.current.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
                        } else if (Math.random() < 0.6) {
                            buttonRef.current.style.borderColor = '#f59e0b'; // Amber
                            buttonRef.current.style.color = '#f59e0b';
                            buttonRef.current.style.backgroundColor = 'rgba(245, 158, 11, 0.15)';
                        } else {
                            buttonRef.current.style.borderColor = '#ffffff'; // White
                            buttonRef.current.style.color = '#ffffff';
                            buttonRef.current.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
                        }
                    } else {
                        if (buttonStateRef.current !== 'chase') {
                            buttonStateRef.current = 'chase';
                            // Reset flickering colors back to CSS rules
                            buttonRef.current.style.borderColor = '';
                            buttonRef.current.style.color = '';
                            buttonRef.current.style.backgroundColor = '';
                        }

                        // Continuous speed acceleration (extremely slow and gentle: 0.003 * dt per frame)
                        currentSpeedRef.current += 0.003 * dt;
                        const maxSpeed = 20; // humanly manageable speed cap
                        const speed = Math.min(currentSpeedRef.current, maxSpeed);

                        // Normalize fleeing direction away from the cursor
                        const ndx = dist > 0 ? dx / dist : (Math.random() - 0.5);
                        const ndy = dist > 0 ? dy / dist : (Math.random() - 0.5);
                        const len = Math.sqrt(ndx * ndx + ndy * ndy);
                        const ux = len > 0 ? ndx / len : (Math.random() > 0.5 ? 1 : -1);
                        const uy = len > 0 ? ndy / len : (Math.random() > 0.5 ? 1 : -1);

                        // Steer smoothly away from mouse (continuous and slow, not jerky)
                        const targetVx = ux * speed;
                        const targetVy = uy * speed;

                        // High inertia: slow turn/response rate (0.97 vs 0.03)
                        vx = vx * 0.97 + targetVx * 0.03;
                        vy = vy * 0.97 + targetVy * 0.03;

                        // Scale velocity to speed
                        const vLen = Math.sqrt(vx * vx + vy * vy);
                        if (vLen > 0) {
                            vx = (vx / vLen) * speed;
                            vy = (vy / vLen) * speed;
                        }

                        px += vx * dt;
                        py += vy * dt;

                        // Track 5-second childhood memory synchronization
                        if (isOver) {
                            successfulHoldTimeRef.current += frameTime;
                            if (successfulHoldTimeRef.current >= 5000) {
                                // Sincronizzazione completata!
                                handleStopHolding();
                                setUnlockedLots(prev => {
                                    if (!prev.includes(activeScene.id)) {
                                        return [...prev, activeScene.id];
                                    }
                                    return prev;
                                });
                            }
                        }
                    }

                    // Viewport boundaries clamp (active only in chase state)
                    if (buttonStateRef.current === 'chase') {
                        let newLeft = rect.left + vx * dt;
                        let newRight = rect.right + vx * dt;
                        let newTop = rect.top + vy * dt;
                        let newBottom = rect.bottom + vy * dt;

                        if (newLeft < 20) {
                            px += (20 - newLeft);
                            vx = Math.abs(vx) * 0.5; // bounce off left
                        } else if (newRight > window.innerWidth - 20) {
                            px += ((window.innerWidth - 20) - newRight);
                            vx = -Math.abs(vx) * 0.5; // bounce off right
                        }

                        if (newTop < 20) {
                            py += (20 - newTop);
                            vy = Math.abs(vy) * 0.5; // bounce off top
                        } else if (newBottom > window.innerHeight - 20) {
                            py += ((window.innerHeight - 20) - newBottom);
                            vy = -Math.abs(vy) * 0.5; // bounce off bottom
                        }
                    }

                    posRef.current = { x: px, y: py };
                    velRef.current = { x: vx, y: vy };

                    // Update transform directly in DOM (skip in flickering state to avoid conflict)
                    if (buttonStateRef.current !== 'flickering') {
                        buttonRef.current.style.transform = `translate(${px}px, ${py}px)`;
                    }

                    // Update memory HUD directly in DOM
                    const pct = Math.min((successfulHoldTimeRef.current / 5000) * 100, 100);
                    const progContainer = document.getElementById('memory-progress-container');
                    const progressBar = document.getElementById('memory-progress-bar');
                    const progressText = document.getElementById('memory-progress-text');

                    if (progContainer && progressBar && progressText) {
                        if (isHolding && buttonStateRef.current === 'chase') {
                            progContainer.classList.remove('hidden');
                            progressText.classList.remove('hidden');
                            progressBar.style.width = `${pct}%`;
                            progressText.innerText = `Sincronizzazione Memoria: ${Math.floor(pct)}%`;
                        } else {
                            progContainer.classList.add('hidden');
                            progressText.classList.add('hidden');
                            progressBar.style.width = '0%';
                        }
                    }

                    // Check hover state change and update React state
                    if (isOver !== wasOverRef.current) {
                        wasOverRef.current = isOver;
                        setIsOverButton(isOver);
                    }

                    animationRef.current = requestAnimationFrame(updatePosition);
                };

                animationRef.current = requestAnimationFrame(updatePosition);
            };

            const stopFleeing = () => {
                if (animationRef.current) {
                    cancelAnimationFrame(animationRef.current);
                    animationRef.current = null;
                }
                posRef.current = { x: 0, y: 0 };
                velRef.current = { x: 0, y: 0 };
                buttonStateRef.current = 'still';
                holdStartTimeRef.current = 0;
                lastFrameTimeRef.current = 0;
                currentSpeedRef.current = 0.3;
                successfulHoldTimeRef.current = 0;

                const progContainer = document.getElementById('memory-progress-container');
                const progressBar = document.getElementById('memory-progress-bar');
                const progressText = document.getElementById('memory-progress-text');
                if (progContainer && progressBar && progressText) {
                    progContainer.classList.add('hidden');
                    progressText.classList.add('hidden');
                    progressBar.style.width = '0%';
                }

                if (buttonRef.current) {
                    buttonRef.current.style.transform = 'translate(0px, 0px)';
                    // Reset any visually mutated styles
                    buttonRef.current.style.borderColor = '';
                    buttonRef.current.style.color = '';
                    buttonRef.current.style.backgroundColor = '';
                }
            };

            // Global listeners during active hold
            useEffect(() => {
                const handleMouseMove = (e) => {
                    mouseRef.current = { x: e.clientX, y: e.clientY };
                };

                const handleTouchMove = (e) => {
                    if (e.touches.length > 0) {
                        mouseRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                };

                if (isHolding) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleStopHolding);
                    window.addEventListener('touchmove', handleTouchMove, { passive: true });
                    window.addEventListener('touchend', handleStopHolding);
                    startFleeing();
                } else {
                    stopFleeing();
                }

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleStopHolding);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('touchend', handleStopHolding);
                };
            }, [isHolding]);

            // Keep isHoldingRef in sync with React state (for MediaPipe callback closures)
            useEffect(() => { isHoldingRef.current = isHolding; }, [isHolding]);

            useEffect(() => {
                if (handEnabled) {
                    document.body.classList.add('hand-active');

                    document.body.classList.remove('hand-active');
                }

            // ── Hand Tracking: enable / disable ──
            useEffect(() => {
                handEnabledRef.current = handEnabled;
                if (!handEnabled) {
                    // Tear down camera & hands
                    if (cameraRef.current) { try { cameraRef.current.stop(); } catch(e) {} cameraRef.current = null; }
                    if (handsRef.current) { try { handsRef.current.close(); } catch(e) {} handsRef.current = null; }
                    setFingerPos(null);
                    setDwellProgress(0);
                    dwellStartRef.current = null;
                    dwellElementRef.current = null;
                    return;
                }

                // Small delay to let video element mount
                const init = setTimeout(() => {
                    const video = videoRef.current;
                    if (!video || !window.Hands || !window.Camera) {
                        console.warn('MediaPipe non disponibile (richiede HTTPS o localhost)');
                        setHandEnabled(false);
                        return;
                    }

                    const hands = new window.Hands({
                        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                    });
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.7,
                        minTrackingConfidence: 0.5,
                    });

                    hands.onResults((results) => {
                        if (!handEnabledRef.current) return;

                        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                            // No hand detected — release hold if active
                            if (isHoldingRef.current) handleStopHolding();
                            setFingerPos(null);
                            fingerPosRef.current = null;
                            setDwellProgress(0);
                            dwellStartRef.current = null;
                            dwellElementRef.current = null;
                            setIsOnHoldBtn(false);
                            return;
                        }

                        // Landmark 8 = index finger tip
                        const tip = results.multiHandLandmarks[0][8];
                        // Mirror X so it feels like a mirror
                        const x = (1 - tip.x) * window.innerWidth;
                        const y = tip.y * window.innerHeight;

                        setFingerPos({ x, y });
                        fingerPosRef.current = { x, y };

                        // ── Finger scroll zones (top 15% = up, bottom 15% = down) ──
                        const scrollZone = window.innerHeight * 0.15;
                        const scrollMaxSpeed = 18;
                        if (y < scrollZone) {
                            const intensity = 1 - (y / scrollZone);
                            window.scrollBy({ top: -scrollMaxSpeed * intensity, behavior: 'auto' });
                        } else if (y > window.innerHeight - scrollZone) {
                            const intensity = (y - (window.innerHeight - scrollZone)) / scrollZone;
                            window.scrollBy({ top: scrollMaxSpeed * intensity, behavior: 'auto' });
                        }

                        // ── Find what's under the finger ──
                        const el = document.elementFromPoint(x, y);

                        // ── Expanded hit zone for the fleeing 'Osserva il Sogno' button ──
                        // Instead of exact hit-test, use distance from button center
                        // +110px padding so finger only needs to be *near* it to keep hold active
                        let onHoldBtn = false;
                        if (buttonRef.current) {
                            const rect = buttonRef.current.getBoundingClientRect();
                            const btnCx = rect.left + rect.width / 2;
                            const btnCy = rect.top + rect.height / 2;
                            const naturalRadius = Math.max(rect.width, rect.height) / 2;
                            const expandedRadius = naturalRadius + 110; // generous padding for finger imprecision
                            const dist = Math.sqrt((x - btnCx) ** 2 + (y - btnCy) ** 2);
                            onHoldBtn = dist <= expandedRadius;
                        }

                        setIsOnHoldBtn(onHoldBtn);

                        if (onHoldBtn) {
                            // Simulate mousedown hold
                            if (!isHoldingRef.current) {
                                handleStartHolding({ clientX: x, clientY: y, preventDefault: () => {} });
                            }
                            // Update mouse position so the button flees from the finger
                            mouseRef.current = { x, y };
                            dwellStartRef.current = null;
                            dwellElementRef.current = null;
                            setDwellProgress(0);
                            return;
                        } else {
                            // Finger moved far from hold button — release
                            if (isHoldingRef.current) handleStopHolding();
                        }


                        // ── Dwell detection for other interactive elements ──
                        // Walk up DOM to find nearest interactive element
                        let interactive = null;
                        let cur = el;
                        while (cur && cur !== document.body) {
                            if (
                                cur.tagName === 'BUTTON' ||
                                cur.tagName === 'A' ||
                                cur.classList.contains('cursor-pointer')
                            ) { interactive = cur; break; }
                            cur = cur.parentElement;
                        }

                        if (!interactive) {
                            dwellStartRef.current = null;
                            dwellElementRef.current = null;
                            setDwellProgress(0);
                            return;
                        }

                        if (dwellElementRef.current !== interactive) {
                            // Entered a new element — restart dwell
                            dwellStartRef.current = performance.now();
                            dwellElementRef.current = interactive;
                            setDwellProgress(0);
                        } else {
                            const elapsed = performance.now() - (dwellStartRef.current || performance.now());
                            const progress = Math.min(elapsed / 750, 1);
                            setDwellProgress(progress);

                            if (elapsed >= 750) {
                                // Fire click!
                                interactive.click();
                                // Reset so it doesn't fire again immediately
                                dwellStartRef.current = performance.now() + 1000;
                                setDwellProgress(0);
                            }
                        }
                    });

                    handsRef.current = hands;

                    const camera = new window.Camera(video, {
                        onFrame: async () => {
                            if (handsRef.current && handEnabledRef.current) {
                                await handsRef.current.send({ image: video });
                            }
                        },
                        width: 320,
                        height: 240,
                    });
                    cameraRef.current = camera;
                    camera.start();
                }, 200);

                return () => clearTimeout(init);
            }, [handEnabled]);

                        {/* Sandpay Title & Official Corporate Description */}

                            </p>

                                                transition: isHolding ? 'none' : 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                                            }}
                                            className={`absolute px-8 py-4 font-bold uppercase tracking-widest font-mono-tech text-xs md:text-sm transition-all border flex items-center justify-center select-none ${
                                                isHolding
                                                    ? (isOverButton
                                                        ? 'bg-red-950/40 border-red-500 text-red-500 shadow-[0_0_20px_rgba(239,68,68,0.25)] cursor-crosshair'
                                                        : 'bg-neutral-900/60 border-neutral-500 text-white shadow-[0_0_12px_rgba(255,255,255,0.08)] cursor-crosshair')
                                                    : 'bg-black border-neutral-800 text-white hover:border-neutral-500 cursor-pointer active:scale-95'
                                            }`}
                                        >
                                            <span className={`w-2.5 h-2.5 rounded-full mr-2.5 ${
                                                isHolding
                                                    ? (isOverButton ? 'bg-red-500 animate-ping' : 'bg-white animate-pulse')
                                                    : 'bg-emerald-500 animate-pulse'
                                            }`}></span>
                                            <span>
                                                {isHolding
                                                    ? (isOverButton ? "OSSERVAZIONE ATTIVA" : "SEGUI IL SOGNO")
                                                    : "OSSERVA IL SOGNO"
                                                }
                                            </span>
                                        </button>
                                    )}
                                </div>
                            </div>

                        </div>
                    )}

                    {/* Poetic Concept Modal */}
                    {showConcept && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
                            <div className="max-w-2xl w-full border border-neutral-800 bg-[#0a0a0d] p-8 md:p-12 relative flex flex-col gap-6 shadow-2xl rounded-sm">
                                
                                {/* Close button corner */}
                                <button 
                                    onClick={() => setShowConcept(false)}
                                    className="absolute top-4 right-4 text-neutral-500 hover:text-white text-xl font-mono-tech transition-colors"
                                    aria-label="Chiudi modal"
                                >
                                    ✕
                                </button>

                                <div className="border-b border-neutral-900 pb-3">
                                    <h2 className="text-xs font-mono-tech text-[#065f46] tracking-widest uppercase">
                                        Concept del Progetto
                                    </h2>
                                </div>

                                <div className="my-2 max-h-[60vh] overflow-y-auto pr-4 flex flex-col gap-4">
                                    <p className="font-serif-editorial text-sm md:text-base leading-relaxed text-neutral-300 text-justify">
                                        La guerra, che tutti noi vediamo prima scivolare e poi irrompere nella realtà, spezza il respiro e rende la veglia faticosa anche solo al pensiero. La consapevolezza di quello che accade per le vie del mondo oscura il risveglio e riempie il cuore di impossibilità e nostalgia. Nostalgia per un tempo passato, forse mai avuto, in cui tanti di noi credono risieda la propria epoca dell'oro. Per realizzare questo progetto, ho disposto dei soldatini di plastica all'interno di spazi domestici.
                                    </p>
                                    <p className="font-serif-editorial text-sm md:text-base leading-relaxed text-neutral-300 text-justify">
                                        La casa è per molti il rifugio più sicuro, il luogo dove nascondersi dall'assedio dell'informazione, delle persone e del destino. Tuttavia, il mondo riserva spesso una sorte sgarbata, riprodotta di frequente perfino nel gioco e nella finzione. Non voglio essere frainteso: non sono qui per criticare o puntare il dito contro chi gioca o riproduce il conflitto nella finzione, voglio solo immortalare una visione. Per questo progetto, ho pensato di intrecciare due immaginari: quello reale dei soldatini immersi nell'abitazione e, in contrasto, un immaginario fantasioso di come quegli scatti prenderebbero vita. Quest'ultimo adotta un'estetica più realistica ma intrinsecamente surrealista, generata attraverso le vie del codice e dei dati dell'intelligenza artificiale.
                                    </p>
                                    <p className="font-serif-editorial text-sm md:text-base leading-relaxed text-neutral-300 text-justify">
                                        Voglio ricondurre queste immagini alle primissime interpretazioni che si possono avere sulla guerra: quando, da esseri umani ancora troppo piccoli e immersi nella nostra epoca d'oro, sottovalutavamo il reale proteggendoci con l'illusione del racconto.
                                    </p>
                                </div>

                                <div className="pt-2 border-t border-neutral-900 flex justify-end">
                                    <button 
                                        onClick={() => setShowConcept(false)}
                                        className="px-6 py-2 border border-neutral-800 hover:border-neutral-500 text-xs font-mono-tech text-neutral-300 hover:text-white transition-all uppercase tracking-wider bg-[#050507]"
                                    >
                                        Chiudi
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Footer */}
                    <footer className="border-t border-[#121217] bg-black px-6 py-6 flex flex-col md:flex-row justify-between items-center gap-4 text-[9px] tracking-widest font-mono-tech text-neutral-600 z-30 relative select-none">
                        <p>© SANDPAY CORP. TUTTI I SOGNI RISERVATI.</p>
                        <p>PROGETTO SOLDATINI DI PLASTICA // EMANUELE BACCIGALUPI</p>
                    </footer>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('app-root'));
        root.render(<SandpayCatalog />);
    </script>
</body>

</html>
