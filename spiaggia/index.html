<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PORTA 01 // LA SPIAGGIA ONIRICA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <!-- il punto di domanda di Charles, lo stesso del museo -->
  <link rel="stylesheet" href="../museo/charles.css?v=6">
</head>

<body class="sez-spiaggia">
  <div id="stage">
    <canvas id="cv" width="1600" height="900" aria-label="La spiaggia onirica, vista dall'alto" role="img"></canvas>
    <div id="crt"></div>

    <!-- ── l'HUD: dove sei, cosa devi fare ─────────────────────── -->
    <div id="hud">
      <div class="panel" id="hud-where">
        <span id="hud-mode">hub</span>
      </div>
      <div class="panel" id="hud-obj">
        <span id="hud-obj-label">MINIGIOCHI CHIUSI</span>
        <span id="hud-obj-val">0 / 4</span>
      </div>
    </div>

    <!-- ── i quattro poteri: costruiti da powers.js ────────────── -->
    <div id="powers"></div>

    <div id="prompt"></div>
    <div id="toast"></div>

    <!-- ── il foglio d'ingresso: solo il nome del gioco ─────────── -->
    <div id="intro">
      <h1>LA SPIAGGIA ONIRICA</h1>
      <button id="btn-start">ENTRA NELLA SPIAGGIA</button>
    </div>

    <a id="back" href="../museo.html?stanza=soffitta&amp;x=860" title="Torna alla soffitta, davanti alla grata della lumaca">◀ SOFFITTA</a>
  </div>

  <script src="sound.js?v=2"></script>
  <script src="powers.js"></script>
  <script src="beach.js"></script>
  <script src="arena.js"></script>
  <script src="game.js?v=2"></script>
  <!-- Charles: per ultimo, così non si mette in mezzo all'avvio -->
  <script src="../museo/charles.js?v=11"></script>
</body>

</html>
