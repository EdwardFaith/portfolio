<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Anche i conigli hanno le ali — Subconscio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --white: #f0f0f0;
            --red: #dc2626;
            --red-glow: rgba(220, 38, 38, 0.45);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--white);
            font-family: 'Courier Prime', monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* ─── CRT / VHS overlays ─── */
        .crt {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%);
            pointer-events: none; z-index: 9990;
        }
        .scanlines {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px, transparent 2px,
                rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
            );
            pointer-events: none; z-index: 9991;
        }
        .noise {
            position: fixed; inset: 0;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9989;
        }

        /* ─── Mind Canvas ─── */
        #mind-container {
            position: relative; width: 100%; height: 100%;
            cursor: grab; overflow: hidden;
            touch-action: none;
        }
        #mind-container:active { cursor: grabbing; }

        #canvas {
            position: absolute; top: 0; left: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* ─── Rabbit Watermark Behind Synapses ─── */
        #rabbit-watermark {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            filter: invert(1);
            mix-blend-mode: screen;
            opacity: 0.12;
            transition: opacity 0.5s ease;
            user-select: none;
        }

        /* ─── Synapses SVG (bounded directly in canvas) ─── */
        #synapses {
            position: absolute; top: 0; left: 0;
            width: 1px; height: 1px;
            overflow: visible; pointer-events: none;
            z-index: 2;
        }
        .synapse-line {
            stroke: rgba(220, 38, 38, 0.22);
            stroke-width: 1.2px;
            fill: none;
            vector-effect: non-scaling-stroke;
        }
        .synapse-line.active {
            stroke: var(--red);
            stroke-width: 1.8px;
            opacity: 0.85;
            animation: pulse 4s infinite;
        }

        /* ─── Thought Nodes ─── */
        .node {
            position: absolute;
            width: var(--node-w, 190px);
            padding: 8px 10px;
            background: rgba(6, 6, 6, 0.92);
            border-left: 2px solid rgba(220, 38, 38, 0.45);
            z-index: 10;
            font-size: var(--node-font, 10.5px);
            line-height: 1.45;
            color: #eaeaea;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
            transition: border-color 0.25s, box-shadow 0.25s, opacity 0.3s;
            will-change: transform;
            animation: nodeFloat var(--float-dur, 5s) ease-in-out infinite alternate;
            animation-delay: var(--float-delay, 0s);
        }
        @keyframes nodeFloat {
            0%   { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(var(--float-x, 4px), var(--float-y, 4px), 0); }
        }
        .node:hover {
            border-color: var(--red);
            box-shadow: 0 0 16px var(--red-glow);
            text-shadow: 1px 0 1px var(--red), -1px 0 1px #555;
            z-index: 999;
        }
        .node.selected {
            border-color: var(--red);
            box-shadow: 0 0 28px rgba(220, 38, 38, 0.35);
            background: rgba(10, 10, 10, 0.97);
            z-index: 1000 !important;
            opacity: 1 !important;
        }
        .node.glitch-anim {
            animation: glitchSkew 0.25s ease both;
            text-shadow: 2px 0 2px var(--red), -2px 0 2px #555;
        }

        /* ─── UI Overlay ─── */
        #ui {
            position: fixed; top: 22px; left: 22px;
            z-index: 10000; pointer-events: none;
        }
        #ui h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.05rem, 3.2vw, 2.2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.1;
            max-width: 75vw;
            text-shadow: 2px 0 var(--red), -2px 0 #555;
            animation: flicker 4s infinite;
        }
        #ui .subtitle {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(240,240,240,0.4);
            margin-top: 4px;
        }

        /* ─── Back button ─── */
        #back-btn {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 10000;
            display: flex; align-items: center; gap: 8px;
            background: rgba(5,5,5,0.85);
            border: 1px solid rgba(240,240,240,0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 14px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(240,240,240,0.65);
            text-decoration: none;
            transition: border-color 0.3s, color 0.3s, transform 0.2s;
        }
        #back-btn:hover {
            border-color: var(--red);
            color: var(--red);
            transform: translateY(-1px);
        }
        #back-btn .rabbit-svg { fill: currentColor; }

        /* ─── Floating Controls ─── */
        #controls {
            position: fixed;
            bottom: 24px;
            right: 20px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 10px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .ctrl-btn {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(240, 240, 240, 0.75);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .ctrl-btn:hover {
            color: #fff;
            border-color: rgba(220, 38, 38, 0.5);
            background: rgba(220, 38, 38, 0.15);
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        .ctrl-btn.active {
            color: #fff;
            border-color: var(--red);
            background: rgba(220, 38, 38, 0.25);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
        }

        /* ─── Mobile Touch Hint ─── */
        #mobile-hint {
            position: fixed;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(220, 38, 38, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(240, 240, 240, 0.75);
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.8s ease;
        }
        #mobile-hint.hidden {
            opacity: 0;
        }

        /* ─── Loading screen ─── */
        #loader {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 99999;
            gap: 20px;
            transition: opacity 0.6s ease;
        }
        #loader.fade-out { opacity: 0; pointer-events: none; }
        #loader .loader-rabbit {
            animation: rabbitBounce 0.9s ease-in-out infinite;
        }
        #loader p {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
        }
        #loader .bar {
            width: 200px; max-width: 80%; height: 2px;
            background: #1a1a1a;
            position: relative; overflow: hidden;
            border-radius: 2px;
        }
        #loader .bar::after {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--red);
            animation: loadBar 1.2s ease forwards;
        }

        /* ─── Responsive Adjustments ─── */
        @media (max-width: 768px) {
            :root {
                --node-w: 150px;
                --node-font: 9.5px;
            }
            #ui { top: 16px; left: 16px; }
            #ui h1 { font-size: 1.05rem; }
            #ui .subtitle { font-size: 0.55rem; letter-spacing: 2px; }
            #back-btn { top: 14px; right: 14px; padding: 6px 10px; font-size: 0.55rem; }
            #controls { bottom: 18px; right: 50%; transform: translateX(50%); gap: 5px; padding: 4px 8px; }
            .ctrl-btn { padding: 5px 9px; font-size: 0.7rem; }
            #mobile-hint { bottom: 62px; font-size: 0.55rem; padding: 5px 10px; }
        }

        /* ─── Animations ─── */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @keyframes flicker {
            0%  { opacity: 1; }
            2%  { opacity: 0.75; transform: translateX(2px); }
            4%  { opacity: 1; transform: translateX(0); }
            20% { opacity: 1; }
            21% { opacity: 0.2; }
            22% { opacity: 1; }
            80% { opacity: 1; }
            82% { opacity: 0.6; text-shadow: -2px 0 var(--red), 2px 0 #555; }
            83% { opacity: 1; }
            100% { opacity: 1; }
        }
        @keyframes glitchSkew {
            0%   { transform: skew(0deg); }
            20%  { transform: skew(-6deg); }
            40%  { transform: skew(6deg); }
            60%  { transform: skew(-3deg); }
            80%  { transform: skew(3deg); }
            100% { transform: skew(0deg); }
        }
        @keyframes rabbitBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes loadBar {
            to { left: 0; }
        }
    </style>
</head>

<body>

    <!-- Loading screen -->
    <div id="loader">
        <div class="loader-rabbit">
            <svg viewBox="0 0 60 80" width="68" height="68" fill="white" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="20" cy="18" rx="7" ry="18"/>
                <ellipse cx="40" cy="18" rx="7" ry="18"/>
                <ellipse cx="30" cy="42" rx="18" ry="16"/>
                <ellipse cx="30" cy="65" rx="22" ry="15"/>
                <ellipse cx="48" cy="72" rx="7" ry="5"/>
            </svg>
        </div>
        <p>Connessione sinapsi subconscio...</p>
        <div class="bar"></div>
    </div>

    <!-- CRT Effects -->
    <div class="crt"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>

    <!-- Mind Canvas -->
    <div id="mind-container">
        <div id="canvas">
            <img id="rabbit-watermark" src="rabbit.png" alt="" draggable="false">
            <svg id="synapses" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <!-- UI Overlay -->
    <div id="ui">
        <h1>Anche i conigli hanno le ali</h1>
        <div class="subtitle">Mappa Neurale dei Pensieri</div>
    </div>

    <!-- Back button -->
    <a id="back-btn" href="../index.html">
        <svg class="rabbit-svg" viewBox="0 0 60 80" width="12" height="12" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="20" cy="18" rx="7" ry="18"/>
            <ellipse cx="40" cy="18" rx="7" ry="18"/>
            <ellipse cx="30" cy="42" rx="18" ry="16"/>
            <ellipse cx="30" cy="65" rx="22" ry="15"/>
            <ellipse cx="48" cy="72" rx="7" ry="5"/>
        </svg>
        ← Torna
    </a>

    <!-- Mobile Hint -->
    <div id="mobile-hint">Tocca per leggere • Pizzica per zoomare</div>

    <!-- Controls -->
    <div id="controls">
        <button id="btn-zoom-out" class="ctrl-btn" title="Riduci">-</button>
        <button id="btn-toggle-view" class="ctrl-btn active" title="Alterna Vista Sagoma / Lettura">
            <span>🐇</span>
            <span id="btn-toggle-label">Sagoma</span>
        </button>
        <button id="btn-zoom-in" class="ctrl-btn" title="Ingrandisci">+</button>
        <button id="btn-sound" class="ctrl-btn" title="Audio d'ambiente">
            <span id="sound-icon">🔈</span>
        </button>
    </div>

    <!-- Scripts -->
    <script src="rabbit_coords.js"></script>
    <script src="testi.js"></script>

    <script>
    // ============================================================
    //  Anche i conigli hanno le ali — Neural Rabbit Visualizer
    //  Scrittura Creativa → Sagoma Coniglio (Ottimizzato Mobile)
    // ============================================================

    const canvas        = document.getElementById('canvas');
    const mindContainer = document.getElementById('mind-container');
    const synapsesSvg   = document.getElementById('synapses');
    const watermark     = document.getElementById('rabbit-watermark');
    const mobileHint    = document.getElementById('mobile-hint');
    const btnToggle     = document.getElementById('btn-toggle-view');
    const btnToggleLabel= document.getElementById('btn-toggle-label');
    const btnZoomIn     = document.getElementById('btn-zoom-in');
    const btnZoomOut    = document.getElementById('btn-zoom-out');
    const btnSound      = document.getElementById('btn-sound');
    const soundIcon     = document.getElementById('sound-icon');

    const isMobile = window.innerWidth <= 768 || ('ontouchstart' in window && window.innerWidth <= 1024);

    let autoPan     = false;
    let autoPanVelX = 0.35;
    let autoPanVelY = 0.2;
    let scale       = 1;
    let translateX  = window.innerWidth / 2;
    let translateY  = window.innerHeight / 2;
    let isDragging  = false;
    let startDragX  = 0;
    let startDragY  = 0;

    const nodes        = [];
    const nodeElements = [];
    let orderedChunks  = [];
    let audioContext   = null;
    let audioActive    = false;
    let activeTweenId  = null;
    let selectedNodeIdx = null;

    // Scaling constants
    const SCALE_F    = 14;
    const NODE_W     = isMobile ? 150 : 190;
    const RABBIT_VIS_THRESHOLD = 0.12;

    // Bounding dimensions of rabbit artwork in world coordinates
    const RABBIT_WIDTH_WORLD  = 520 * SCALE_F;  // ~7280px
    const RABBIT_HEIGHT_WORLD = 900 * SCALE_F;  // ~12600px

    // ── Helper: Compute scale to fit entire rabbit in screen ───
    function getRabbitFitScale() {
        const margin = isMobile ? 0.84 : 0.78;
        const scaleX = (window.innerWidth * margin) / RABBIT_WIDTH_WORLD;
        const scaleY = (window.innerHeight * margin) / RABBIT_HEIGHT_WORLD;
        return Math.max(0.02, Math.min(scaleX, scaleY));
    }

    function getReadingScale() {
        return isMobile ? 0.72 : 0.95;
    }

    // ── Text Splitting ──────────────────────────────────────────
    function splitText(text, max = 220) {
        if (text.length <= max) return [text];
        const parts = text.split(/(?<=[.!?…»])\s+/);
        const chunks = [];
        let cur = '';
        for (const p of parts) {
            if (p.length > max) {
                if (cur.trim()) { chunks.push(cur.trim()); cur = ''; }
                const words = p.split(' ');
                let line = '';
                for (const w of words) {
                    if ((line + ' ' + w).trim().length > max) {
                        if (line.trim()) chunks.push(line.trim());
                        line = w;
                    } else { line = (line + ' ' + w).trim(); }
                }
                if (line.trim()) chunks.push(line.trim());
            } else if ((cur + ' ' + p).trim().length > max) {
                if (cur.trim()) chunks.push(cur.trim());
                cur = p;
            } else { cur = (cur + ' ' + p).trim(); }
        }
        if (cur.trim()) chunks.push(cur.trim());
        return chunks.length ? chunks : [text.substring(0, max)];
    }

    // ── Init ────────────────────────────────────────────────────
    function init() {
        // Setup texts
        let allChunks = [];
        orderedChunks = [];
        if (typeof CREATIVE_TEXTS !== 'undefined' && Array.isArray(CREATIVE_TEXTS)) {
            CREATIVE_TEXTS.forEach(t => {
                splitText(t, 220).forEach(c => {
                    if (c.trim().length > 3) {
                        allChunks.push({ text: c.trim(), originalIndex: orderedChunks.length });
                        orderedChunks.push(c.trim());
                    }
                });
            });
        }

        if (allChunks.length === 0) {
            allChunks.push({ text: "Anche i conigli hanno le ali.", originalIndex: 0 });
            orderedChunks.push("Anche i conigli hanno le ali.");
        }

        // Duplicate if needed to populate rabbit
        const targetNodes = isMobile ? Math.min(allChunks.length, 380) : Math.min(allChunks.length, 850);
        while (allChunks.length < targetNodes) {
            allChunks = allChunks.concat(allChunks.map(c => ({...c})));
        }

        // Shuffle chunks
        for (let i = allChunks.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allChunks[i], allChunks[j]] = [allChunks[j], allChunks[i]];
        }

        // Retrieve precomputed rabbit coords from rabbit.png
        let coords = (typeof RABBIT_COORDS !== 'undefined' && Array.isArray(RABBIT_COORDS) && RABBIT_COORDS.length > 0)
            ? RABBIT_COORDS
            : [];

        // Fallback generator if coordinates script failed
        if (coords.length === 0) {
            console.warn("RABBIT_COORDS fallback generation active.");
            for (let angle = 0; angle < Math.PI * 2; angle += 0.02) {
                const r = 260;
                coords.push([Math.cos(angle) * r, Math.sin(angle) * r]);
            }
        }

        // Shuffle coords once for organic distribution
        const shuffledCoords = coords.slice();
        for (let i = shuffledCoords.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledCoords[i], shuffledCoords[j]] = [shuffledCoords[j], shuffledCoords[i]];
        }

        // Align watermark image with rabbit center
        if (watermark) {
            watermark.style.left   = `${-486 * SCALE_F}px`;
            watermark.style.top    = `${-512 * SCALE_F}px`;
            watermark.style.width  = `${1024 * SCALE_F}px`;
            watermark.style.height = `${1024 * SCALE_F}px`;
        }

        // Build nodes
        const jitterAmount = isMobile ? SCALE_F * 0.45 : SCALE_F * 0.7;
        for (let i = 0; i < targetNodes; i++) {
            const pt = shuffledCoords[i % shuffledCoords.length];
            const jX = (Math.random() - 0.5) * jitterAmount;
            const jY = (Math.random() - 0.5) * jitterAmount;
            const chunk = allChunks[i % allChunks.length];

            nodes.push({
                id: i,
                text: chunk.text,
                originalIndex: chunk.originalIndex,
                x: pt[0] * SCALE_F + jX,
                y: pt[1] * SCALE_F + jY
            });
        }

        // Start with the rabbit silhouette perfectly visible on screen
        scale = getRabbitFitScale();
        translateX = window.innerWidth / 2;
        translateY = window.innerHeight / 2;

        renderNodes();
        updateTransform();
        drawSynapses();
        setupInteractions();
        animate();

        // Dismiss loader smoothly
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 700);
            }
        }, 1100);

        // Hide mobile hint after 5s
        setTimeout(() => {
            if (mobileHint) mobileHint.classList.add('hidden');
        }, 5000);
    }

    // ── Render Nodes (GPU-accelerated CSS animations) ───────────
    function renderNodes() {
        nodes.forEach((node, idx) => {
            const el = document.createElement('div');
            el.className = 'node';
            el.style.left = `${node.x}px`;
            el.style.top  = `${node.y}px`;

            // GPU float variables
            el.style.setProperty('--float-dur', `${3.5 + (idx % 7) * 0.6}s`);
            el.style.setProperty('--float-delay', `${-(idx % 9) * 0.5}s`);
            el.style.setProperty('--float-x', `${((idx % 5) - 2) * 2.2}px`);
            el.style.setProperty('--float-y', `${(((idx + 2) % 5) - 2) * 2.2}px`);

            el.innerHTML = `<p>${node.text}</p>`;
            canvas.appendChild(el);
            nodeElements[idx] = el;

            // Click / tap handler
            el.addEventListener('click', e => {
                e.stopPropagation();
                openNode(node, idx);
            });

            // Subtle glitch effect on small percentage of nodes
            if (idx % 28 === 0) {
                setInterval(() => {
                    el.classList.add('glitch-anim');
                    setTimeout(() => el.classList.remove('glitch-anim'), 250);
                }, 7000 + (idx % 11) * 1200);
            }
        });
    }

    // ── Open Node Reader ─────────────────────────────────────────
    function openNode(node, idx) {
        initAudio();
        autoPan = false;
        selectedNodeIdx = idx;

        nodeElements.forEach(n => {
            if (n) {
                n.style.opacity = '0.12';
                n.classList.remove('selected');
            }
        });

        const el = nodeElements[idx];
        if (!el) return;

        el.classList.add('selected');
        const prevText = orderedChunks[node.originalIndex - 1] || "";
        const nextText = orderedChunks[node.originalIndex + 1] || "";

        el.innerHTML = `
            ${prevText ? `<p style="opacity:0.45; font-size:0.88em; margin-bottom:8px; line-height:1.4;">${prevText}</p>` : ''}
            <p style="font-weight:bold; color:var(--red); font-size:1.08em; line-height:1.5;">${node.text}</p>
            ${nextText ? `<p style="opacity:0.45; font-size:0.88em; margin-top:8px; line-height:1.4;">${nextText}</p>` : ''}
        `;
        el.style.width = isMobile ? 'min(320px, 86vw)' : '380px';

        // Zoom smoothly to selected node
        const targetScale = getReadingScale();
        const targetX = window.innerWidth / 2 - (node.x + NODE_W / 2) * targetScale;
        const targetY = window.innerHeight / 2 - (node.y + 20) * targetScale;

        flyTo(targetX, targetY, targetScale, 750);
        updateToggleState(false);
    }

    function resetNodes() {
        if (selectedNodeIdx === null) return;
        selectedNodeIdx = null;

        nodeElements.forEach((n, idx) => {
            if (n) {
                n.style.opacity = '1';
                n.style.width = '';
                n.classList.remove('selected');
                n.innerHTML = `<p>${nodes[idx].text}</p>`;
            }
        });
    }

    // ── Fast Spatial Grid Synapses (executes in ~2ms) ────────────
    function drawSynapses() {
        synapsesSvg.innerHTML = '';
        const K = isMobile ? 2 : 3;
        const drawn = new Set();
        const cellSize = 550;
        const grid = new Map();

        nodes.forEach((n, i) => {
            const gx = Math.floor(n.x / cellSize);
            const gy = Math.floor(n.y / cellSize);
            const key = `${gx},${gy}`;
            if (!grid.has(key)) grid.set(key, []);
            grid.get(key).push(i);
        });

        const ox = NODE_W / 2;
        const oy = 22;

        for (let i = 0; i < nodes.length; i++) {
            const n1 = nodes[i];
            const gx = Math.floor(n1.x / cellSize);
            const gy = Math.floor(n1.y / cellSize);
            const candidates = [];

            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const cell = grid.get(`${gx + dx},${gy + dy}`);
                    if (cell) {
                        for (let c = 0; c < cell.length; c++) {
                            const j = cell[c];
                            if (j !== i) candidates.push(j);
                        }
                    }
                }
            }

            const dists = [];
            for (let c = 0; c < candidates.length; c++) {
                const j = candidates[c];
                const n2 = nodes[j];
                const ddx = n2.x - n1.x;
                const ddy = n2.y - n1.y;
                dists.push({ j, d: ddx * ddx + ddy * ddy });
            }
            dists.sort((a, b) => a.d - b.d);

            for (const { j } of dists.slice(0, K)) {
                const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                if (drawn.has(key)) continue;
                drawn.add(key);

                const n2 = nodes[j];
                const x1 = n1.x + ox, y1 = n1.y + oy;
                const x2 = n2.x + ox, y2 = n2.y + oy;
                const cx = (x1 + x2) / 2 + (Math.random() - 0.5) * 70;
                const cy = (y1 + y2) / 2 + (Math.random() - 0.5) * 70;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`);
                path.setAttribute('class', 'synapse-line' + (Math.random() > 0.82 ? ' active' : ''));
                synapsesSvg.appendChild(path);
            }
        }
    }

    // ── Smooth Camera Transition (FlyTo) ────────────────────────
    function flyTo(targetX, targetY, targetScale, duration = 800, onComplete) {
        if (activeTweenId) cancelAnimationFrame(activeTweenId);
        const startX = translateX;
        const startY = translateY;
        const startS = scale;
        const startTime = performance.now();

        function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(1, elapsed / duration);
            // Ease-in-out cubic
            const ease = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;

            translateX = startX + (targetX - startX) * ease;
            translateY = startY + (targetY - startY) * ease;
            scale      = startS + (targetScale - startS) * ease;
            updateTransform();

            if (progress < 1) {
                activeTweenId = requestAnimationFrame(step);
            } else {
                activeTweenId = null;
                if (onComplete) onComplete();
            }
        }
        activeTweenId = requestAnimationFrame(step);
    }

    // ── Toggle View: Sagoma Coniglio vs Lettura Pensieri ─────────
    function toggleView() {
        initAudio();
        const fitScale = getRabbitFitScale();
        const isCurrentlyRabbitView = Math.abs(scale - fitScale) < 0.05 || scale <= RABBIT_VIS_THRESHOLD;

        if (isCurrentlyRabbitView) {
            // Zoom into Reading mode
            resetNodes();
            const targetScale = getReadingScale();
            const targetX = translateX;
            const targetY = translateY;
            flyTo(targetX, targetY, targetScale, 800, () => {
                autoPan = true;
            });
            updateToggleState(false);
        } else {
            // Zoom out to Rabbit silhouette overview
            resetNodes();
            autoPan = false;
            const targetScale = fitScale;
            const targetX = window.innerWidth / 2;
            const targetY = window.innerHeight / 2;
            flyTo(targetX, targetY, targetScale, 900);
            updateToggleState(true);
        }
    }

    function updateToggleState(isRabbitView) {
        if (isRabbitView) {
            btnToggle.classList.add('active');
            btnToggleLabel.textContent = "Sagoma";
        } else {
            btnToggle.classList.remove('active');
            btnToggleLabel.textContent = "Leggi";
        }
    }

    // ── Transform ───────────────────────────────────────────────
    function updateTransform() {
        canvas.style.transform = `translate3d(${translateX.toFixed(1)}px, ${translateY.toFixed(1)}px, 0) scale(${scale.toFixed(4)})`;

        // Watermark opacity based on zoom
        if (watermark) {
            if (scale < 0.1) {
                watermark.style.opacity = '0.14';
            } else if (scale < 0.3) {
                watermark.style.opacity = '0.08';
            } else {
                watermark.style.opacity = '0.03';
            }
        }
    }

    // ── Mouse & Touch Interactions ──────────────────────────────
    function setupInteractions() {
        // Desktop Mouse Drag
        mindContainer.addEventListener('mousedown', e => {
            if (e.target.closest('#controls') || e.target.closest('#back-btn')) return;
            isDragging = true;
            startDragX = e.clientX - translateX;
            startDragY = e.clientY - translateY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            translateX = e.clientX - startDragX;
            translateY = e.clientY - startDragY;
            updateTransform();
        });

        // Desktop Mouse Wheel
        mindContainer.addEventListener('wheel', e => {
            e.preventDefault();
            const factor = Math.exp((e.deltaY < 0 ? 1 : -1) * 0.065);
            const newScale = Math.max(0.02, Math.min(scale * factor, 4.0));
            translateX = e.clientX - (e.clientX - translateX) * (newScale / scale);
            translateY = e.clientY - (e.clientY - translateY) * (newScale / scale);
            scale = newScale;
            updateTransform();
            updateToggleState(scale <= RABBIT_VIS_THRESHOLD);
        }, { passive: false });

        // Container Click
        mindContainer.addEventListener('click', e => {
            if (e.target.closest('.node') || e.target.closest('#controls') || e.target.closest('#back-btn')) return;
            initAudio();
            resetNodes();
            if (scale > RABBIT_VIS_THRESHOLD) autoPan = true;
        });

        // Touch Gestures (Pinch zoom + Single finger drag + Double tap)
        let initialPinchDist = 0;
        let initialPinchScale = 1;
        let initialPinchCenter = { x: 0, y: 0 };
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;
        let isTouchDragging = false;
        let lastTapTime = 0;

        mindContainer.addEventListener('touchstart', e => {
            if (e.target.closest('#controls') || e.target.closest('#back-btn')) return;
            if (mobileHint) mobileHint.classList.add('hidden');

            if (e.touches.length === 1) {
                touchMoved = false;
                isTouchDragging = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                startDragX = e.touches[0].clientX - translateX;
                startDragY = e.touches[0].clientY - translateY;
            } else if (e.touches.length === 2) {
                isTouchDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDist = Math.hypot(dx, dy);
                initialPinchScale = scale;
                initialPinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        }, { passive: false });

        mindContainer.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 1 && isTouchDragging) {
                const dist = Math.hypot(e.touches[0].clientX - touchStartX, e.touches[0].clientY - touchStartY);
                if (dist > 7) touchMoved = true;
                translateX = e.touches[0].clientX - startDragX;
                translateY = e.touches[0].clientY - startDragY;
                updateTransform();
            } else if (e.touches.length === 2 && initialPinchDist > 0) {
                touchMoved = true;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const factor = dist / initialPinchDist;
                const newScale = Math.max(0.02, Math.min(initialPinchScale * factor, 4.0));

                const cx = initialPinchCenter.x;
                const cy = initialPinchCenter.y;
                translateX = cx - (cx - translateX) * (newScale / scale);
                translateY = cy - (cy - translateY) * (newScale / scale);
                scale = newScale;
                updateTransform();
                updateToggleState(scale <= RABBIT_VIS_THRESHOLD);
            }
        }, { passive: false });

        mindContainer.addEventListener('touchend', e => {
            if (e.touches.length === 0) {
                isTouchDragging = false;
                initialPinchDist = 0;

                // Double tap handling
                if (!touchMoved && !e.target.closest('.node')) {
                    const now = Date.now();
                    if (now - lastTapTime < 320) {
                        toggleView();
                        lastTapTime = 0;
                    } else {
                        lastTapTime = now;
                    }
                }
            } else if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                startDragX = e.touches[0].clientX - translateX;
                startDragY = e.touches[0].clientY - translateY;
                isTouchDragging = true;
                initialPinchDist = 0;
            }
        }, { passive: true });

        // Floating Control Buttons
        btnToggle.addEventListener('click', e => {
            e.stopPropagation();
            toggleView();
        });

        btnZoomIn.addEventListener('click', e => {
            e.stopPropagation();
            initAudio();
            const targetScale = Math.min(scale * 1.5, 4.0);
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const targetX = cx - (cx - translateX) * (targetScale / scale);
            const targetY = cy - (cy - translateY) * (targetScale / scale);
            flyTo(targetX, targetY, targetScale, 400);
            updateToggleState(targetScale <= RABBIT_VIS_THRESHOLD);
        });

        btnZoomOut.addEventListener('click', e => {
            e.stopPropagation();
            initAudio();
            const targetScale = Math.max(scale * 0.65, 0.02);
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const targetX = cx - (cx - translateX) * (targetScale / scale);
            const targetY = cy - (cy - translateY) * (targetScale / scale);
            flyTo(targetX, targetY, targetScale, 400);
            updateToggleState(targetScale <= RABBIT_VIS_THRESHOLD);
        });

        btnSound.addEventListener('click', e => {
            e.stopPropagation();
            toggleSound();
        });

        // Window resize
        window.addEventListener('resize', () => {
            if (scale <= RABBIT_VIS_THRESHOLD) {
                scale = getRabbitFitScale();
                translateX = window.innerWidth / 2;
                translateY = window.innerHeight / 2;
                updateTransform();
            }
        });
    }

    // ── Animation Loop (Only handles smooth autopan, zero style recalcs!) ──
    function animate() {
        if (autoPan && !isDragging && scale > RABBIT_VIS_THRESHOLD) {
            if (Math.random() < 0.015) {
                autoPanVelX += (Math.random() - 0.5) * 0.06;
                autoPanVelY += (Math.random() - 0.5) * 0.06;
                autoPanVelX = Math.max(-0.6, Math.min(0.6, autoPanVelX));
                autoPanVelY = Math.max(-0.6, Math.min(0.6, autoPanVelY));
            }
            translateX -= autoPanVelX;
            translateY -= autoPanVelY;
            updateTransform();
        }
        requestAnimationFrame(animate);
    }

    // ── Ambient Subconscious Audio ──────────────────────────────
    function initAudio() {
        if (audioContext) {
            if (audioContext.state === 'suspended') audioContext.resume();
            return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioContext = new AudioCtx();
        audioActive = true;
        soundIcon.textContent = "🔊";

        // Soft pinkish background noise
        const bufferSize = audioContext.sampleRate * 2;
        const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            output[i] = (b0 + b1 + b2) * 0.15;
        }

        const noiseSource = audioContext.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.loop = true;

        const filter = audioContext.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 320;

        const gainNode = audioContext.createGain();
        gainNode.gain.value = 0.035;

        noiseSource.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioContext.destination);
        noiseSource.start();

        // Occasional faint neural chime/radio sweep
        setInterval(() => {
            if (!audioActive || !audioContext || Math.random() > 0.5) return;
            try {
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(90 + Math.random() * 180, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45 + Math.random() * 40, audioContext.currentTime + 1.8);

                const oscGain = audioContext.createGain();
                oscGain.gain.setValueAtTime(0, audioContext.currentTime);
                oscGain.gain.linearRampToValueAtTime(0.012, audioContext.currentTime + 0.3);
                oscGain.gain.linearRampToValueAtTime(0.0001, audioContext.currentTime + 1.8);

                osc.connect(oscGain);
                oscGain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 1.8);
            } catch (err) {}
        }, 4000);
    }

    function toggleSound() {
        if (!audioContext) {
            initAudio();
            return;
        }
        if (audioContext.state === 'running') {
            audioContext.suspend();
            audioActive = false;
            soundIcon.textContent = "🔈";
        } else {
            audioContext.resume();
            audioActive = true;
            soundIcon.textContent = "🔊";
        }
    }

    window.addEventListener('DOMContentLoaded', init);
    </script>
