<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>EDWARD INDUSTRIES — OPERATION GODKILLER</title>
  <meta name="description"
    content="Operation Godkiller: un action roguelike top-down pixel art della Edward Industries. Elimina la paranoia di Dio, contratto dopo contratto.">
  <meta name="theme-color" content="#07080a">
  <link rel="icon" type="image/png" sizes="32x32" href="../immagini/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="stage">
    <canvas id="cv" width="640" height="360" aria-label="Operation Godkiller — gioco"></canvas>
    <div id="crt" aria-hidden="true"><i class="scan"></i><i class="vig"></i><i class="grain"></i></div>

    <a id="back" href="../museo.html?stanza=ministero&amp;x=1256">← IL MINISTERO DELLA CARNE</a>
  </div>

  <script>
    /* Quando questa pagina gira dentro il cabinato della nave
       (Protocollo Deicida), il link di ritorno non deve portare al
       museo: deve spegnere il cabinato e riconsegnare il giocatore
       alla plancia. Fuori dall'iframe non cambia niente. */
    (function () {
      if (window.self === window.top) return;
      var back = document.getElementById('back');
      if (!back) return;
      back.textContent = '← TORNA ALLA NAVE';
      back.href = '#';
      back.addEventListener('click', function (e) {
        e.preventDefault();
        try { window.parent.postMessage('gk-arcade-exit', '*'); } catch (err) { /* ignora */ }
      });
    }());
  </script>

  <script src="../schermo-intero.js"></script>
  <script type="module" src="src/main.js"></script>
  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#07080a;color:#ff2d75;font-family:monospace;padding:2rem;text-align:center;">
      Operation Godkiller richiede JavaScript attivo.<br><a href="../museo.html?stanza=ministero&amp;x=1256" style="color:#38bdf8;">torna al Ministero della Carne</a>
    </div>
  </noscript>
</body>

</html>
