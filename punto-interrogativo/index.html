<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fcfcfa">
<link rel="manifest" href="manifest.webmanifest">
<title>?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- STATO ZERO: il punto interrogativo (identico su proiezione e tablet) -->
  <div id="zero" class="zero">
    <span id="qmark" class="qmark">?</span>
  </div>

  <!-- QR + link: visibile solo quando nessun tablet è collegato -->
  <div id="qr" class="qr">
    <div id="qrcode"></div>
    <div id="qrlink"></div>
  </div>

  <!-- TABLET: dizionario infinito -->
  <main id="dict" class="dict hidden"></main>

  <!-- PROIEZIONE: zona interazione (specchio) + zona disegno -->
  <section id="stage" class="stage hidden">
    <div id="mirror" class="mirror"><div id="mirrorInner" class="dict-body"></div></div>
    <div id="drawing" class="drawing"><canvas id="drawCanvas"></canvas></div>
  </section>

  <input id="uploader" type="file" accept="image/*" multiple hidden>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>if (!window.mqtt) document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"><\/script>');</script>
  <script src="js/lexicon.js"></script>
  <script src="poses/poses.js"></script>
  <script src="js/figures.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
